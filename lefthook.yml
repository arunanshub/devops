pre-commit:
  parallel: true
  commands:
    Format go files:
      run: golangci-lint fmt {staged_files}
      glob: ["*.go", "go.mod", "go.sum"]
      stage_fixed: true

    Lint go files:
      run: golangci-lint run --fix ./...
      glob: ["*.go", go.mod, "go.sum"]
      stage_fixed: true

    Tidy go.mod and go.sum:
      run: go mod tidy
      glob: ["go.mod", "go.sum", "*.go"]
      stage_fixed: true

    # Tidy go.work:
    #   run: go work sync
    #   glob: [go.mod, go.sum, "*.go"]
    #   stage_fixed: true

    tofu-fmt:
      run: tofu fmt -recursive
      root: infra/
      stage_fixed: true
      glob: ["*.tf", "*.tfvars"]

    tofu-validate:
      run: tofu validate
      root: infra/
      glob: ["*.tf", "*.tfvars"]

    gitleaks:
      run: gitleaks git --pre-commit

    just-fmt:
      run: just --fmt --unstable
      stage_fixed: true
      glob: ["*.just", "{J,j}ustfile"]

    shell-script-check:
      run: shellcheck --enable=all --severity=style {staged_files}
      glob: ["*.sh", "*.bash", "*.sh.tpl", "*.bash.tpl"]
      stage_fixed: true

    yamlfmt:
      run: yamlfmt {staged_files}
      stage_fixed: true
      glob: ["*.yaml", "*.yml"]

    kustomize-validate:
      run: >
        kustomize build kubernetes/overlays/prod | kubeconform --strict --ignore-missing-schemas --summary --schema-location default --schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      glob: ["kubernetes/**/*.yaml"]
