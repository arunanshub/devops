pre-commit:
  parallel: true
  commands:
    Format go files:
      run: ./custom-gcl fmt {staged_files}
      glob: ["*.go", "go.mod", "go.sum"]
      stage_fixed: true

    Lint go files:
      run: ./custom-gcl run --fix ./...
      glob: ["*.go", go.mod, "go.sum"]
      stage_fixed: true

    Tidy go.mod and go.sum:
      run: go mod tidy
      glob: ["go.mod", "go.sum", "*.go"]
      stage_fixed: true

    # Tidy go.work:
    #   run: go work sync
    #   glob: [go.mod, go.sum, "*.go"]
    #   stage_fixed: true

    tofu-fmt:
      run: tofu fmt -recursive
      root: infra/
      stage_fixed: true
      glob: ["*.tf", "*.tfvars"]

    tofu-validate:
      run: tofu validate
      root: infra/
      glob: ["*.tf", "*.tfvars"]

    gitleaks:
      run: gitleaks git --pre-commit

    shell-script-check:
      run: shellcheck --enable=all --severity=style {staged_files}
      glob: ["*.sh", "*.bash", "*.sh.tpl", "*.bash.tpl"]
      stage_fixed: true

    yamlfmt:
      run: yamlfmt {staged_files}
      stage_fixed: true
      glob: ["*.yaml", "*.yml"]

    ansible-lint:
      run: uv run ansible-lint ansible/playbooks ansible/roles
      glob: ["ansible/**/*.yml", "ansible.cfg", "pyproject.toml", "uv.lock"]

    node-config-schema:
      run: go run ./cmd/opsctl verify-node-config
      glob: ["nodes/**/*.yaml", "internal/nodecfg/*.go", "cmd/opsctl/verify_node_config.go"]

    kustomize-validate:
      run: just check-manifests
      glob: ["kubernetes/**/*.yaml"]

    repo-policy:
      run: just check-no-shell check-justfile check-no-manifest-tests

    zizmor:
      run: just check-actions
      glob: [".github/**"]

    policy-rego:
      run: just policy-lint policy-test
      glob: ["policy/**", ".regal/**"]
