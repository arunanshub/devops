pre-commit:
  parallel: true
  commands:
    tofu-fmt:
      run: tofu fmt -recursive
      root: infra/
      stage_fixed: true

    tofu-validate:
      run: tofu validate
      root: infra/

    gitleaks:
      run: gitleaks git --pre-commit

    just-fmt:
      run: just --fmt --unstable
      stage_fixed: true

    shell-script-check:
      run: shellcheck --enable=all --severity=style {staged_files}
      glob: [ "*.sh", "*.bash", "*.sh.tpl", "*.bash.tpl" ]
      stage_fixed: true
