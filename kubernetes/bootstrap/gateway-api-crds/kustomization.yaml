# Gateway API standard channel CRDs for one-time bootstrap.
#
# Helmfile wraps this kustomization as a synthetic Helm chart and installs it
# as the release "gateway-api-crds" before Cilium. Traefik owns the GatewayClass;
# Cilium Gateway API is disabled.
#
# Keep this intentionally separate from kubernetes/base/infra/gateway-api-crds so
# bootstrap and ArgoCD ownership can evolve independently.
#
# Keep this version in sync with kubernetes/base/infra/gateway-api-crds/kustomization.yaml.
# Validate against the Traefik minor version's Gateway API support matrix.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml
