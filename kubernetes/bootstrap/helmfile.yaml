repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: argocd
    chart: argo/argo-cd
    version: 9.5.6
    namespace: argocd
    cleanupOnFail: true
    createNamespace: true
    cascade: background
    values:
      - ../apps/argocd/values.yaml # single source of truth for values
      - ./bootstrap.yaml.gotmpl # secrets from bootstrap, rendered with sops
