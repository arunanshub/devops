repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: hcloud
    url: https://charts.hetzner.cloud
  - name: cilium
    url: https://helm.cilium.io/

releases:
  - name: gateway-api-crds
    namespace: kube-system
    chart: ./gateway-api-crds
    wait: true

  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: "1.19.4"
    wait: true
    needs:
      - kube-system/gateway-api-crds
      - kube-system/hccm
    values:
      - values/cilium.yaml.gotmpl

  - name: hccm
    namespace: kube-system
    chart: hcloud/hcloud-cloud-controller-manager
    version: "1.30.1"
    wait: true
    values:
      - values/ccm.yaml

  - name: argocd
    chart: argo/argo-cd
    needs:
      - kube-system/hccm
    version: 9.5.11
    namespace: argocd
    cleanupOnFail: true
    createNamespace: true
    cascade: background
    values:
      - ./values/argocd.yaml
      - ./values/bootstrap.yaml.gotmpl
