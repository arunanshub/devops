repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: hcloud
    url: https://charts.hetzner.cloud
  - name: cilium
    url: https://helm.cilium.io/

releases:
  - name: gateway-api-crds
    namespace: kube-system
    chart: ./gateway-api-crds
    wait: true

  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: "1.20.3"
    wait: true
    needs:
      - kube-system/gateway-api-crds
      - kube-system/hccm
    values:
      - values/cilium.yaml.gotmpl

  - name: hcloud-secret
    namespace: kube-system
    chart: ./raw
    values:
      - values/hcloud-secret.yaml.gotmpl

  - name: hccm
    namespace: kube-system
    chart: hcloud/hcloud-cloud-controller-manager
    version: "1.39.0"
    wait: true
    needs:
      - kube-system/hcloud-secret
    values:
      - values/ccm.yaml

  - name: argocd
    chart: argo/argo-cd
    needs:
      - kube-system/hccm
    version: 10.17.1
    namespace: argocd
    cleanupOnFail: true
    createNamespace: true
    cascade: background
    values:
      - ./values/argocd.yaml
      - ./values/bootstrap.yaml.gotmpl

  - name: argocd-bootstrap
    namespace: argocd
    chart: ./raw
    needs:
      - argocd/argocd
    # The root Application's CRD comes from the argocd release, so helm-diff
    # cannot validate it before first install (verified on an empty k3d).
    disableValidationOnInstall: true
    values:
      - values/argocd-bootstrap.yaml.gotmpl
