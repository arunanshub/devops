networking:
  # Enable private network support. CCM will manage pod routing via Hetzner's
  # private network instead of public interfaces.
  enabled: true
  # Must match k3s's pod CIDR. k3s default is 10.42.0.0/16.
  clusterCIDR: 10.42.0.0/16
  # Reads the network name/ID from the same hcloud secret.
  # The chart's default already points to secret "hcloud", key "network" — kept explicit for clarity.
  network:
    valueFrom:
      secretKeyRef:
        name: hcloud
        key: network

monitoring:
  enabled: true
  podMonitor:
    # Bootstrap-safe even though the CRD doesn't exist yet: the chart gates
    # this on Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor",
    # so it renders nothing until the monitoring stack lands.
    enabled: true
    labels:
      release: kube-prometheus-stack

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

replicaCount: 3

resources:
  requests:
    cpu: 25m
    memory: 100Mi
  limits:
    memory: 256Mi

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: hcloud-cloud-controller-manager
            app.kubernetes.io/instance: hccm
        topologyKey: kubernetes.io/hostname

# Already default, but explicit is better than implicit.
priorityClassName: system-cluster-critical
