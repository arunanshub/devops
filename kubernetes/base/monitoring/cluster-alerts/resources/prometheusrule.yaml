apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-alerts
  namespace: monitoring
spec:
  groups:
    - name: cluster.nodes
      interval: 1m
      rules:
        # A node cordoned for too long usually means a k3s upgrade drain stalled
        # (slow pod shutdown, PDB blocking eviction, or a hanging Job). The SUC
        # upgrade runs with concurrency:1 — a stuck drain blocks all further upgrades.
        - alert: NodeCordonedTooLong
          expr: kube_node_spec_unschedulable == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} has been cordoned for >15 minutes"
            description: "{{ $labels.node }} is unschedulable. Likely causes: k3s upgrade drain stalled (SUC), manual cordon forgotten, or eviction blocked by PDB. Check: kubectl describe node {{ $labels.node }}"

    - name: cluster.upgrades
      interval: 1m
      rules:
        # The system-upgrade-controller (SUC) cordons a node BEFORE running its
        # k3s upgrade Job and only uncordons on SUCCESS, retrying a failed Job
        # forever — so a perpetually-failing Job strands the node cordoned and
        # re-cordons on every retry (cp-3, 2026-06-26: the stable channel
        # resolved below the running version → the k3s-upgrade downgrade-guard
        # failed every Job). This fires on the Job's Failed condition — the root
        # cause — ~10m ahead of the 15m NodeCordonedTooLong symptom alert, and
        # distinguishes "SUC upgrade broke" from a forgotten manual cordon.
        # kube_job_failed is emitted only when a Job's Failed condition is true.
        - alert: K3sUpgradeJobFailing
          expr: kube_job_failed{namespace="system-upgrade"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "SUC k3s upgrade Job {{ $labels.job_name }} is failing"
            description: "An SUC upgrade Job in system-upgrade has had a Failed condition for >5m. SUC retries forever and cordons the target node on each attempt, so the node will be stranded unschedulable. Common cause: the Plan target is below the running k3s version (downgrade guard) — k3s cannot be downgraded. Check: kubectl -n system-upgrade get jobs,pods; kubectl -n system-upgrade logs job/{{ $labels.job_name }}; kubectl -n system-upgrade get plan k3s-server -o yaml"

    - name: cluster.argocd
      interval: 1m
      rules:
        # A persistent non-synced state covers render errors, failed applies,
        # and reconciliation that cannot reach the declared Git state. The
        # delay suppresses normal auto-sync transitions.
        - alert: ArgoCDApplicationNotSynced
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD Application {{ $labels.name }} is not synchronized"
            description: "Application {{ $labels.name }} targets namespace {{ $labels.namespace }} and has sync status {{ $labels.sync_status }} and health status {{ $labels.health_status }} for more than 15 minutes. Check: kubectl -n argocd get application {{ $labels.name }} -o yaml"

        # A degraded Application can have a valid render but an unhealthy live
        # resource. Keep this separate from sync state because the response and
        # severity differ.
        - alert: ArgoCDApplicationDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD Application {{ $labels.name }} is degraded"
            description: "Application {{ $labels.name }} targets namespace {{ $labels.namespace }} and has been degraded for more than 10 minutes. Sync status is {{ $labels.sync_status }}. Check: kubectl -n argocd get application {{ $labels.name }} -o yaml"

        # The state alerts cannot work when the application-controller metrics
        # target is absent. This also detects a broken ServiceMonitor or scrape.
        - alert: ArgoCDApplicationMetricsAbsent
          expr: absent(argocd_app_info) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD Application metrics are absent"
            description: "VictoriaMetrics has received no argocd_app_info samples for more than 15 minutes. Check the argocd-metrics Service, the ServiceMonitor in monitoring, and vmagent target status."

    - name: cluster.tunnel
      interval: 1m
      rules:
        # cloudflared can deadlock with all tunnel connections closed while the
        # process stays alive. Kubernetes sees it healthy but external traffic fails.
        - alert: CloudflaredTunnelDead
          expr: sum(cloudflare_tunnel_active_streams) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "All Cloudflare tunnel streams are closed"
            description: "No active streams on any cloudflared replica for 5m. External traffic is failing. Check: kubectl logs -n cloudflared -l app=cloudflared"

    - name: cluster.resources
      interval: 1m
      rules:
        # Limit over-commit is benign in itself (limits are ceilings; actual usage is the
        # real OOM guard, covered by node-usage alerts). This is a CREEP/REGRESSION signal:
        # it usually means a new or changed workload carries a large limit:request ratio
        # that VPA is inflating. Threshold 200% sits above post-fix steady state (max node
        # was 155% before, drops after the traefik/vmsingle fix). Node-level, not per-container
        # ratio, because RequestsOnly workloads show a high ratio at idle by design.
        - alert: NodeMemoryLimitCommitmentHigh
          expr: |
            sum by (node) (kube_pod_container_resource_limits{resource="memory"})
            / on(node)
            sum by (node) (kube_node_status_allocatable{resource="memory"})
            > 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} memory-limit commitment above 200%"
            description: "Sum of container memory limits on {{ $labels.node }} exceeds 2x allocatable for >30m. This is a config-drift/regression signal, not a stability alert. Likely a new or changed workload with a large limit:request ratio that VPA is inflating. Check: kubectl get pods -A -o json | jq -r '.items[]|.spec.containers[]|select(.resources.limits.memory)|\"\\(.resources.limits.memory) \\(.name)\"' | sort -h | tail. See docs/specs/2026-07-12-memory-limit-rightsizing-design.md."
