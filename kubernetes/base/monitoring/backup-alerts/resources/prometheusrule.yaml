apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-alerts
  namespace: monitoring
spec:
  groups:
    - name: backup
      interval: 5m
      rules:
        - alert: VeleroBackupMissed
          # scope to real schedule names (velero-*) — one-off manual backups
          # labeled with ad-hoc schedule names leave stale series that would
          # fire this alert indefinitely even though no schedule is broken.
          expr: (time() - velero_backup_last_successful_timestamp{schedule=~"velero-.*"}) > 90000
          labels:
            severity: warning
          annotations:
            summary: "Velero scheduled backup missed"
            description: "No successful backup for schedule {{ $labels.schedule }} in over 25 hours."

        - alert: VeleroBackupFailed
          expr: increase(velero_backup_failure_total[2h]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Velero backup failed"
            description: "{{ $value }} backup failure(s) in the last 2 hours."

        - alert: VeleroBSLUnavailable
          expr: velero_backup_location_status_gauge{backup_location_name="default"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Velero backup storage location unavailable"
            description: "The default R2 BackupStorageLocation is not reachable."

        - alert: EtcdSnapshotStale
          expr: |
            absent(kube_cronjob_status_last_successful_time{cronjob="etcd-snapshot-health", namespace="kube-system"})
            or
            (time() - kube_cronjob_status_last_successful_time{cronjob="etcd-snapshot-health", namespace="kube-system"}) > 36000
          labels:
            severity: warning
          annotations:
            summary: "etcd snapshot health check has not succeeded"
            description: "The etcd-snapshot-health CronJob has never run or last succeeded more than 10 hours ago."

        - alert: VeleroRestoreDrillMissed
          expr: |
            absent(kube_cronjob_status_last_successful_time{cronjob="velero-restore-drill", namespace="velero"})
            or
            (time() - kube_cronjob_status_last_successful_time{cronjob="velero-restore-drill", namespace="velero"}) > 2678400
          labels:
            severity: warning
          annotations:
            summary: "Monthly Velero restore drill has not run"
            description: "No successful restore drill in over 31 days. Verify backup integrity manually."
