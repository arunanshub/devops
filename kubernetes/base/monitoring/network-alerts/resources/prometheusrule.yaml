apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: network-alerts
  namespace: monitoring
spec:
  groups:
    - name: overlay-network
      interval: 1m
      rules:
        # Kernel-level drops of DF-set packets: almost always a misconfigured
        # MTU somewhere in the VXLAN/WireGuard overlay stack. Non-zero here
        # means traffic is being silently discarded.
        - alert: KernelIPFragFails
          expr: increase(node_netstat_Ip_FragFails[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "IP fragmentation failures on {{ $labels.instance }}"
            description: >-
              {{ $value }} packets with DF bit set were dropped on {{ $labels.instance }} in the last 5 minutes. Indicates MTU misconfiguration in the overlay stack. Expected path MTU: enp7s0=1450, cilium_wg0=1370 (-80 WG), pod MTU=1320 (-50 VXLAN). Run: ip link show | grep mtu on the affected node. #magic___^_^___line
        # Hubble-level drops from Cilium's eBPF datapath. Covers policy
        # violations, MTU drops that bypass the kernel counter above, and
        # any unknown traffic. Threshold of 10 filters one-off noise.
        - alert: HubbleDropsDetected
          expr: increase(hubble_drop_total[5m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cilium eBPF datapath drops on {{ $labels.node }}"
            description: >-
              {{ $value }} eBPF-level drops in the last 5 minutes on {{ $labels.node }}. Reason: {{ $labels.reason }}, direction: {{ $labels.direction }}. Investigate with: hubble observe --verdict DROPPED --follow #magic___^_^___line
        # cilium-health marks a node unreachable when ICMP and HTTP probes both
        # fail. Primary cause: WireGuard session failed to establish after idle
        # period (keepalive at 25s prevents this, but alert remains a safety net).
        - alert: CiliumUnreachableNode
          expr: cilium_unreachable_nodes > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cilium reports unreachable node from {{ $labels.instance }}"
            description: >-
              {{ $value }} node(s) unreachable from {{ $labels.instance }} per cilium-health probes. Primary cause: WireGuard session failure or network partition. Run: cilium-health status --probe  (exec into any cilium DaemonSet pod). #magic___^_^___line
        # Endpoint-level health failures (pod health checks failing), distinct
        # from node-level failures above.
        - alert: CiliumUnreachableEndpoints
          expr: cilium_unreachable_health_endpoints > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cilium health endpoints unreachable from {{ $labels.instance }}"
            description: >-
              {{ $value }} health check endpoint(s) unreachable on {{ $labels.instance }}. Run: cilium-health status --probe  (exec into the cilium pod on that node).
