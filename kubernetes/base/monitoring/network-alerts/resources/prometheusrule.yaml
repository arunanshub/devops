apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: network-alerts
  namespace: monitoring
spec:
  groups:
    - name: overlay-network
      interval: 1m
      rules:
        # Kernel-level drops of DF-set packets: almost always a misconfigured
        # MTU somewhere in the VXLAN/WireGuard overlay stack. Non-zero here
        # means traffic is being silently discarded.
        - alert: KernelIPFragFails
          expr: increase(node_netstat_Ip_FragFails[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "IP fragmentation failures on {{ $labels.instance }}"
            description: "{{ $value }} packets with DF bit set dropped on {{ $labels.instance }} in 5m. MTU misconfiguration in overlay stack. Expected: enp7s0=1450, cilium_wg0=1370 (-80 WG), pod=1320 (-50 VXLAN). Check: ip link show | grep mtu"

        # Hubble-level drops from Cilium's eBPF datapath. Covers policy
        # violations, MTU drops that bypass the kernel counter above, and
        # any unknown traffic. Threshold of 10 filters one-off noise.
        # UNSUPPORTED_L3_PROTOCOL is excluded: Cilium is IPv4-only, so IPv6
        # link-local Router Solicitation packets (fe80::* → ff02::2) from the
        # host kernel's NDP stack always land here during Cilium restarts/reboots.
        # These are harmless and expected — not a real datapath failure.
        - alert: HubbleDropsDetected
          expr: increase(hubble_drop_total{reason!="UNSUPPORTED_L3_PROTOCOL"}[5m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cilium eBPF datapath drops on {{ $labels.node }}"
            description: "{{ $value }} eBPF drops in 5m on {{ $labels.node }}. Reason: {{ $labels.reason }}, direction: {{ $labels.direction }}. Run: hubble observe --verdict DROPPED --follow"

        # cilium-health marks a node unreachable when ICMP and HTTP probes both
        # fail. Primary cause: WireGuard session failed to establish after idle
        # period (keepalive at 25s prevents this, but alert remains a safety net).
        - alert: CiliumUnreachableNode
          expr: cilium_unreachable_nodes > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cilium reports unreachable node from {{ $labels.instance }}"
            description: "{{ $value }} node(s) unreachable from {{ $labels.instance }}. Likely WireGuard session failure or network partition. Run: cilium-health status --probe (exec into any cilium pod)"

        # Endpoint-level health failures (pod health checks failing), distinct
        # from node-level failures above.
        - alert: CiliumUnreachableEndpoints
          expr: cilium_unreachable_health_endpoints > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cilium health endpoints unreachable from {{ $labels.instance }}"
            description: "{{ $value }} health endpoint(s) unreachable on {{ $labels.instance }}. Run: cilium-health status --probe (exec into the cilium pod on that node)"
