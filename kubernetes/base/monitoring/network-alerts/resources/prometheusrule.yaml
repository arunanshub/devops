apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: network-alerts
  namespace: monitoring
spec:
  groups:
    - name: overlay-network
      interval: 1m
      rules:
        # Kernel-level drops of DF-set packets: almost always a misconfigured
        # MTU somewhere in the VXLAN/WireGuard overlay stack. Non-zero here
        # means traffic is being silently discarded.
        - alert: KernelIPFragFails
          expr: increase(node_netstat_Ip_FragFails[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "IP fragmentation failures on {{ $labels.instance }}"
            description: "{{ $value }} packets with DF bit set dropped on {{ $labels.instance }} in 5m. MTU misconfiguration in overlay stack. Expected: enp7s0=1450, cilium_wg0=1355 (-95 WG), pod=1305 (-50 VXLAN). Check: ip link show | grep mtu"

        # Hubble-level drops from Cilium's eBPF datapath. Covers policy
        # violations, MTU drops that bypass the kernel counter above, and
        # any unknown traffic. Threshold of 10 filters one-off noise.
        # UNSUPPORTED_L3_PROTOCOL is excluded: Cilium is IPv4-only, so IPv6
        # link-local Router Solicitation packets (fe80::* → ff02::2) from the
        # host kernel's NDP stack always land here during Cilium restarts/reboots.
        # These are harmless and expected — not a real datapath failure.
        - alert: HubbleDropsDetected
          expr: increase(hubble_drop_total{reason!="UNSUPPORTED_L3_PROTOCOL"}[5m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cilium {{ $labels.reason }}: {{ $labels.source_namespace }}/{{ $labels.source_workload }} ({{ $labels.source_ip }}) -> {{ $labels.destination_namespace }}/{{ $labels.destination_workload }} ({{ $labels.destination_ip }})"
            description: "{{ $value }} eBPF drops in 5m on {{ $labels.node }}. Source: namespace={{ $labels.source_namespace }}, workload={{ $labels.source_workload }}, IP={{ $labels.source_ip }}. Destination: namespace={{ $labels.destination_namespace }}, workload={{ $labels.destination_workload }}, IP={{ $labels.destination_ip }}. Reason={{ $labels.reason }}, protocol={{ $labels.protocol }}, direction={{ $labels.traffic_direction }}."

        # cilium-health marks a node unreachable when ICMP and HTTP probes both
        # fail. Primary cause: WireGuard session failed to establish after idle
        # period (keepalive at 25s prevents this, but alert remains a safety net).
        - alert: CiliumUnreachableNode
          expr: cilium_unreachable_nodes > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cilium reports unreachable node from {{ $labels.instance }}"
            description: "{{ $value }} node(s) unreachable from {{ $labels.instance }}. Likely WireGuard session failure or network partition. Run: cilium-health status --probe (exec into any cilium pod)"

        # Endpoint-level health failures (pod health checks failing), distinct
        # from node-level failures above.
        - alert: CiliumUnreachableEndpoints
          expr: cilium_unreachable_health_endpoints > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cilium health endpoints unreachable from {{ $labels.instance }}"
            description: "{{ $value }} health endpoint(s) unreachable on {{ $labels.instance }}. Run: cilium-health status --probe (exec into the cilium pod on that node)"

        # cilium_wg0 tx drops are kernel staged-queue overflow under GSO
        # bursts. Hubble cannot see them. The queue is bounded on purpose.
        # 0.5% is the level where TCP throughput suffers. The floor of 1500
        # keeps the ratio honest when cross-node traffic falls.
        # Do not lower these values. Check the TCP retransmit ratio first.
        # See docs/2026-08-07-cilium-wireguard-tx-drops-research.md.
        - alert: CiliumWireGuardTransmitDrops
          expr: >-
            increase(node_network_transmit_drop_total{job="node-exporter",device="cilium_wg0"}[30m]) / increase(node_network_transmit_packets_total{job="node-exporter",device="cilium_wg0"}[30m]) > 0.005 and increase(node_network_transmit_drop_total{job="node-exporter",device="cilium_wg0"}[30m]) > 1500
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "WireGuard transmit drop ratio high on {{ $labels.instance }}"
            description: "cilium_wg0 dropped {{ $value | humanizePercentage }} of transmitted packets over 30m on {{ $labels.instance }}, and more than 1500 packets, for 1 hour. Check the TCP retransmit ratio first. If retransmits are flat, the datapath is healthy and this alert needs a higher threshold. Run: just diagnose-wireguard node=<kubernetes-node-name> duration=900"

    # cloudflared is the SOLE external ingress path into the cluster. Each replica
    # holds 4 HA connections to the Cloudflare edge; healthy steady state is 8
    # (2 replicas x 4). This group watches that the tunnel stays connected.
    - name: cloudflared-tunnel
      interval: 1m
      rules:
        # Below one full replica's worth of edge connections sustained for 5m means
        # redundancy is lost and ingress is at risk (a rolling restart dips to 4, not
        # below, and the 5m window rides that out). The /ready probe + KEDA min 2
        # normally self-heal; this fires when they don't.
        - alert: CloudflaredTunnelRedundancyLost
          expr: sum(cloudflared_tunnel_ha_connections) < 4
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cloudflare tunnel edge connections degraded"
            description: "Total cloudflared edge HA connections is {{ $value }} (healthy = 8 = 2 replicas x 4). Below 4 means less than one fully-connected replica — external ingress is at risk. Check: kubectl -n cloudflared get pods; kubectl -n cloudflared logs -l app=cloudflared (now JSON-formatted)"
