apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # AppProject must exist before any Application referencing it.
    # Matches the pattern used by kubernetes/base/infra/appproject.yaml.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  sourceRepos:
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - git@github.com:arunanshub/devops.git

  destinations:
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc

  orphanedResources:
    warn: true

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
