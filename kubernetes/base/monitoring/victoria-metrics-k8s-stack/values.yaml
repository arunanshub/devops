# victoria-metrics-k8s-stack — drop-in replacement for kube-prometheus-stack.
#
# MIGRATION STATE: Phase 0/1 (deployed ALONGSIDE kube-prometheus-stack).
# grafana, kube-state-metrics and prometheus-node-exporter are DISABLED here: the
# still-running kube-prometheus-stack owns them, and vmagent scrapes them via the
# VMServiceScrapes auto-converted from kube-prom's ServiceMonitors. These three get
# enabled (and their kube-prom customizations ported over) in the Phase 4 cutover
# commit that removes kube-prometheus-stack. See docs/plans + the migration plan.

# REQUIRED in ArgoCD when the Application sets helm.releaseName, otherwise the
# generated VMServiceScrapes cannot select the chart's own Services. Must equal the
# ArgoCD Application name. See chart values comment on argocdReleaseOverride.
argocdReleaseOverride: victoria-metrics-k8s-stack

# Base Grafana URL used to build alert "source"/dashboard links in vmalert (and the
# notifications it sends). Without this they render hostless (http://explore/...). The
# datasource name must match the provisioned VM datasource so Explore links resolve.
external:
  grafana:
    host: https://grafana.arunanshu.dev
    datasource: VictoriaMetrics

victoria-metrics-operator:
  enabled: true
  # operator.disable_prometheus_converter defaults to false → ServiceMonitor /
  # PodMonitor / PrometheusRule objects are auto-converted to VM CRDs. This is what
  # keeps cloudflared/Cilium/Traefik/KEDA/Tempo/hcloud-ccm/alert-app definitions working
  # untouched during and after the migration.

# vmsingle: single-binary TSDB + query, replaces the Prometheus server.
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "14d" # matches the previous Prometheus retention
    replicaCount: 1
    extraArgs:
      # vmsingle sizes caches to memory.allowedPercent=60% of the cgroup limit by default,
      # so RSS scales with the limit. We pin the cache to a FIXED size via allowedBytes
      # (decoupled from the limit) so we control memory directly.
      #
      # History: 350MB was set to stop an OOM on a 1Gi limit during the parallel run. The
      # ~80% slow-insert ratio (TooHighSlowInsertsRate) was driven mostly by uncontrolled
      # apiserver/etcd histogram cardinality (~340k series) — fixed by the kubeApiServer
      # metric drops below, which cut active series back to the kube-prom baseline. 512MB
      # comfortably holds that working set; no OOM (cache fixed by allowedBytes, not the limit).
      memory.allowedBytes: "768MB"
    storage:
      storageClassName: hcloud-volumes-encrypted
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        # Safety ceiling only (cache is fixed by memory.allowedBytes above, so RSS does NOT
        # track this). Headroom = limit − cache for the ingest/query working set. Don't raise
        # this to "fix" an OOM — raise/lower memory.allowedBytes instead.
        memory: 2Gi

# vmagent: scraping, replaces Prometheus scrape loop. selectAllByDefault (chart default)
# makes it scrape every converted ServiceMonitor/PodMonitor cluster-wide — mirrors the old
# serviceMonitorSelectorNilUsesHelmValues: false behaviour.
vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s # matches the previous Prometheus default scrape interval
    resources:
      requests:
        cpu: 50m
        memory: 96Mi

# vmalert: rule evaluation. selectAllByDefault (chart default) evaluates every converted
# PrometheusRule/VMRule cluster-wide.
vmalert:
  enabled: true

# Alertmanager (operator-managed upstream prom/alertmanager). Now the primary alert
# router (kube-prom's Alertmanager is decommissioned in the same cutover). Config ported
# from the old kube-prometheus-stack values; the SMTP SealedSecret is mounted via
# spec.secrets at /etc/vm/secrets/alertmanager-smtp/ (note: different path than
# prometheus-operator's Alertmanager). useManagedConfig defaults false, so config uses the
# standard Prometheus Alertmanager schema.
alertmanager:
  enabled: true
  spec:
    secrets:
      - alertmanager-smtp
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.resend.com:587"
      smtp_from: "onboarding@resend.dev"
      smtp_auth_username: "resend"
      smtp_auth_password_file: /etc/vm/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: email
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        # InfoInhibitor is a kube-prometheus meta-alert that exists ONLY to inhibit info
        # alerts (see inhibit_rules below); it must be routed to null, not emailed.
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: mydellpc07@gmail.com
            send_resolved: true
    # Standard kube-prometheus inhibition: a higher-severity alert silences lower-severity
    # ones for the same alert/namespace, and InfoInhibitor mutes info alerts unless a
    # warning/critical is also firing in that namespace. Stops the info-level noise.
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: ["namespace", "alertname"]
      - source_matchers:
          - severity = "warning"
        target_matchers:
          - severity = "info"
        equal: ["namespace", "alertname"]
      - source_matchers:
          - alertname = "InfoInhibitor"
        target_matchers:
          - severity = "info"
        equal: ["namespace"]

# Grafana is enabled and serves grafana.arunanshu.dev (route repointed to the VM
# grafana service). Fresh PVC — clean cut on local UI state, per migration decision;
# dashboards/datasources are provisioned, admin comes from the grafana-admin secret.
defaultDatasources:
  victoriametrics:
    datasources:
      # uid "prometheus" so the bundled kube-prometheus dashboards (${DS_PROMETHEUS})
      # and Tempo's serviceMap.datasourceUid: prometheus resolve without edits. The VM
      # URL is injected by the chart. (Dropped the default victoriametrics-metrics
      # datasource entry — it needs an internet-installed plugin we don't ship.)
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        uid: prometheus
        isDefault: true
  extra:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      jsonData:
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Single replica + Recreate on an RWO encrypted volume — same rationale as the old
  # kube-prom Grafana: SQLite session store can't be split across pods, and RollingUpdate
  # would deadlock on the already-attached RWO volume.
  replicas: 1
  persistence:
    enabled: true
    storageClassName: hcloud-volumes-encrypted
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  deploymentStrategy:
    type: Recreate
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 384Mi

# VM-managed now (kube-prom's are decommissioned in the same cutover; the node-exporter
# hostPort 9100 handoff self-resolves once kube-prom's DaemonSet is pruned).
kube-state-metrics:
  enabled: true
  # VPA recommendations as custom-resource-state metrics (ported from kube-prom). KSM
  # auto-prefixes kube_customresource_, yielding kube_customresource_vpa_containerrecommendations_*
  # which Grafana dashboard 14588 expects.
  rbac:
    extraRules:
      - apiGroups: ["autoscaling.k8s.io"]
        resources: ["verticalpodautoscalers"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: autoscaling.k8s.io
              version: v1
              kind: VerticalPodAutoscaler
            labelsFromPath:
              verticalpodautoscaler: [metadata, name]
              namespace: [metadata, namespace]
              target_api_version: [apiVersion]
              target_kind: [spec, targetRef, kind]
              target_name: [spec, targetRef, name]
            metrics:
              - name: vpa_containerrecommendations_target
                help: "VPA target resource recommendation per container."
                commonLabels: {resource: memory, unit: byte}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [target, memory]
              - name: vpa_containerrecommendations_target
                help: "VPA target resource recommendation per container."
                commonLabels: {resource: cpu, unit: core}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [target, cpu]
              - name: vpa_containerrecommendations_lowerbound
                help: "VPA lower bound recommendation per container."
                commonLabels: {resource: memory, unit: byte}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [lowerBound, memory]
              - name: vpa_containerrecommendations_lowerbound
                help: "VPA lower bound recommendation per container."
                commonLabels: {resource: cpu, unit: core}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [lowerBound, cpu]
              - name: vpa_containerrecommendations_upperbound
                help: "VPA upper bound recommendation per container."
                commonLabels: {resource: memory, unit: byte}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [upperBound, memory]
              - name: vpa_containerrecommendations_upperbound
                help: "VPA upper bound recommendation per container."
                commonLabels: {resource: cpu, unit: core}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [upperBound, cpu]
              - name: vpa_containerrecommendations_uncappedtarget
                help: "VPA uncapped target recommendation per container (ignores resourcePolicy)."
                commonLabels: {resource: memory, unit: byte}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [uncappedTarget, memory]
              - name: vpa_containerrecommendations_uncappedtarget
                help: "VPA uncapped target recommendation per container (ignores resourcePolicy)."
                commonLabels: {resource: cpu, unit: core}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [uncappedTarget, cpu]

prometheus-node-exporter:
  enabled: true
  # List REPLACES the chart default, so the chart's filesystem excludes are repeated here
  # alongside the netstat regex ported from kube-prom (extended with Ip_FragFails /
  # Ip_ReasmFails — direct MTU-misconfiguration indicators in the overlay stack).
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
    - >-
      --collector.netstat.fields=^(.*_(InErrors|InErrs)|Ip_Forwarding|Ip_FragFails|Ip_ReasmFails|Ip(6|Ext)_(InOctets|OutOctets)|Icmp6?_(InMsgs|OutMsgs)|TcpExt_(Listen.*|Syncookies.*|TCPSynRetrans|TCPTimeouts|TCPOFOQueue|TCPRcvQDrop)|Tcp_(ActiveOpens|InSegs|OutSegs|OutRsts|PassiveOpens|RetransSegs|CurrEstab)|Udp6?_(InDatagrams|OutDatagrams|NoPorts|RcvbufErrors|SndbufErrors))$

# apiserver/etcd request-duration histograms are the dominant cardinality source
# (~340k of ~580k active series). kube-prometheus-stack dropped the intermediate histogram
# buckets by default via metricRelabelings; the VM chart's apiserver scrape does NOT, so the
# migration silently ingested the full firehose — driving node memory up and the tsid cache
# to ~80% (TooHighSlowInsertsRate). Restore the exact kube-prom drop (keeps the SLO-relevant
# le buckets so the kubeApiserver* rules still work). The full endpoint spec is repeated
# because providing .endpoints replaces the chart default list.
kubeApiServer:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: https
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
          metricRelabelConfigs:
            # (1) kube-prom parity: thin the request-duration histograms' intermediate le buckets.
            - action: drop
              sourceLabels: [__name__, le]
              regex: '(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?'
            # (2) drop apiserver *internal* histograms no dashboard/alert uses (~66k series:
            # body sizes, response sizes, watch list/cache/events). Pure plumbing — zero
            # visible change, large cardinality cut. Drops bucket+sum+count of each.
            - action: drop
              sourceLabels: [__name__]
              regex: 'apiserver_(request_body_size_bytes|response_sizes|watch_list_duration_seconds|watch_cache_read_wait_seconds|watch_events_sizes)_(bucket|sum|count)'

# k3s is a single binary: apiserver + etcd + scheduler + controller-manager all share one
# process. The kubelet port 10250 /metrics endpoint on control-plane nodes therefore exposes
# ALL embedded component metrics — not just kubelet metrics. Without explicit drops, ~104k
# series duplicate what the kubeApiServer job above already scrapes (apiserver_*) or are
# the internal histograms targeted by the drops above (request_body_size, watch_list, etc.).
#
# .spec.metricRelabelConfigs replaces the chart's default list, so the 3 chart defaults
# (uid/id+name labeldrop, rest_client drop) are re-stated here to preserve them.
kubelet:
  spec:
    metricRelabelConfigs:
      # chart defaults — preserve (list-replace means we must re-state these)
      - action: labeldrop
        regex: (uid)
      - action: labeldrop
        regex: (id|name)
      - action: drop
        sourceLabels: [__name__]
        regex: 'rest_client_request_duration_seconds_(bucket|sum|count)'
      # k3s-specific: drop apiserver_* and etcd_* that leak into the kubelet scrape via the
      # embedded binary. job="apiserver" (kubeApiServer above) is the canonical source for
      # these; the kubelet copies are pure duplicates. Verified: no alerting/recording rule
      # pins job="kubelet" for any apiserver_* or etcd_* metric. Expected cut: ~104k series.
      - action: drop
        sourceLabels: [__name__]
        regex: '(apiserver|etcd)_.*'

# k3s embeds/hides these control-plane components (mirrors the old kube-prom config).
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# Re-ships the kube-prometheus dashboards + recording/alerting rules. Disable the rule
# groups for components k3s does not expose, to avoid no-data panels and false alerts.
defaultDashboards:
  enabled: true

defaultRules:
  enabled: true
  groups:
    etcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubernetesSystemScheduler:
      enabled: false
    kubernetesSystemControllerManager:
      enabled: false

# Native scrape for Tempo, replacing its chart ServiceMonitor (disabled in tempo/values.yaml
# because it hardcodes a dead jaeger-metrics endpoint → 0-target false alert). Targets only
# the real tempo-prom-metrics port (3200).
extraObjects:
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMServiceScrape
    metadata:
      name: tempo-metrics
      namespace: monitoring
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: tempo
          app.kubernetes.io/instance: tempo
      endpoints:
        - port: tempo-prom-metrics
