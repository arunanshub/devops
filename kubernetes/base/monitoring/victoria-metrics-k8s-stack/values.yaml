# REQUIRED in ArgoCD when the Application sets helm.releaseName, otherwise the
# generated VMServiceScrapes cannot select the chart's own Services. Must equal the
# ArgoCD Application name.
argocdReleaseOverride: victoria-metrics-k8s-stack

# Base Grafana URL for alert source/dashboard links in vmalert. Datasource name must
# match the provisioned VM datasource so Explore links resolve.
external:
  grafana:
    host: https://grafana.arunanshu.dev
    datasource: VictoriaMetrics

victoria-metrics-operator:
  enabled: true
  # Same shape as grafana and kube-state-metrics: the chart ships `resources: {}` and the
  # VPA had no controlledValues, so the operator ran unbounded. Pinned by RequestsOnly in
  # components/monitoring-vpa/resources/vpa-vm-operator.yaml. 256Mi == that VPA's
  # maxAllowed, so the request can never exceed the limit. Measured 63Mi. No CPU limit.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  # disable_prometheus_converter defaults to false — ServiceMonitor/PodMonitor/PrometheusRule
  # objects are auto-converted to VM CRDs, keeping cilium/traefik/cloudflared/keda/tempo/
  # hcloud-ccm scrape definitions working untouched.
  operator:
    # The converter copies the source object's argocd tracking-id annotation onto
    # the generated VMServiceScrape/VMPodScrape. Without this flag ArgoCD treats
    # those operator-owned objects as app-managed-but-not-in-git and tries to
    # PRUNE them on every sync (→ perpetual OutOfSync, prune-vs-recreate fight).
    # This stamps them with argocd ignore annotations so ArgoCD leaves them alone.
    prometheus_converter_add_argocd_ignore_annotations: true

  # since we already have cert manager, use cert-manager. If not required, ensure
  # to use RespectIgnoreDifferences=true in syncOptions in argocd application.
  admissionWebhooks:
    certManager:
      enabled: true

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "28d"
    replicaCount: 1
    extraArgs:
      # Pin cache to a fixed size so RSS doesn't scale with the cgroup limit (vmsingle
      # defaults to 60% of limit). Tune this, not the memory limit, to control RSS.
      # 512MB: with ~169k active series the TSID cache stays >2x covered (hit rate
      # >99.99%); query misses fall to NVMe (data intact). Was 768MB — saved ~150-220Mi RSS.
      memory.allowedBytes: "512MB"
      # Guard the 4Gi memory limit against a single runaway MetricsQL query over 169k
      # series. maxConcurrentRequests auto-sizes; this caps RAM per query, not count.
      search.maxMemoryPerQuery: "256MB"
      # Surface expensive Grafana panels before they bite: log queries slower than 2s
      # (default 5s) and queries that allocate >64MB. Both increment metrics
      # (vm_slow_queries_total / vm_memory_intensive_queries_total). Pure observability.
      search.logSlowQueryDuration: "2s"
      search.logQueryMemoryUsage: "64MB"
      # NOTE: search.cacheTimestampOffset was tried at 60s here and REVERTED. vmalert
      # writes recording-rule (:increase30d) and ALERTS/ALERTS_FOR_STATE series back with
      # evaluation timestamps that lag ~90-113s. A 60s offset makes those samples "too old",
      # so vmsingle resets the whole rollup result cache every ~10-30s (warn+info log pair
      # each time -> TooManyLogs alert, and net-WORSE cache hit rate). The 5m default tolerates
      # the lag. Do not lower it.
    storage:
      storageClassName: hcloud-volumes-encrypted
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        # Safety ceiling only — RSS is governed by memory.allowedBytes above, not this.
        # VPA is RequestsOnly (components/monitoring-vpa/resources/vpa-vmsingle.yaml), so this
        # stays fixed; 4Gi sits above the measured 2922Mi peak.
        memory: 4Gi

# useStrictSecurity (below) makes the VM operator stamp runAsNonRoot + uid/gid 65534 +
# seccompProfile RuntimeDefault + drop-ALL-caps + no-priv-esc + readOnlyRootFilesystem onto
# the generated pods/containers. Applied to the three STATELESS components only — vmagent
# (emptyDir remote-write queue), vmalert (stateless), vmalertmanager (emptyDir …-db, no PVC,
# verified). vmsingle is intentionally EXCLUDED: it owns a root-owned 10Gi PVC, so switching
# to uid 65534 would fail on the existing root-owned TSDB files (operator issue #749) — that
# needs a staged chown/re-provision migration, not a flag flip. Doc: docs.victoriametrics.com/operator/security/
vmagent:
  enabled: true
  spec:
    useStrictSecurity: true
    scrapeInterval: 30s
    # vmagent buffers remote-write to an on-disk queue on EPHEMERAL pod storage (no PV).
    # If vmsingle is briefly unavailable the queue is unbounded by default and can fill
    # the node disk, harming co-located workloads. Cap it; overflow is dropped (metrics
    # gap) but the node disk is protected.
    extraArgs:
      remoteWrite.maxDiskUsagePerURL: "1GB"
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        # vmagent had NO memory limit and no VPA, so nothing bounded it at all — the
        # largest such workload here. It scrapes every target, so RSS tracks series count and
        # the remote-write queue. 384Mi sits ~2.3x above the measured 164Mi RSS. No CPU
        # limit (matches vmsingle/vmalert): CPU is compressible, requests guarantee
        # scheduling. There is no vmagent VPA, so this ceiling stays exactly as declared.
        memory: 384Mi
    # The operator leaves config-reloader memory UNLIMITED by default — verified live with
    # `kubectl exec <operator-pod> -- /app --printDefaults | grep RELOADER`:
    #   VM_CONFIG_RELOADER_LIMIT_MEMORY   unlimited
    #   VM_CONFIG_RELOADER_REQUEST_MEMORY 25Mi
    # That default is why every config-reloader sidecar ran unbounded. Set per-CR rather
    # than via the global env var: the chart maps operator.* keys to VM_<KEY-WITHOUT-
    # UNDERSCORES>, which cannot produce VM_CONFIG_RELOADER_LIMIT_MEMORY. Requests repeat
    # the operator defaults so this block does not silently drop them. 64Mi vs 9Mi measured.
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi

vmalert:
  enabled: true
  spec:
    useStrictSecurity: true # stateless; see vmagent note above
    # Without this block the VM operator applies its DEFAULT resources, which
    # include a tiny CPU limit (~92m) — and vmalert is bursty (rule-group eval),
    # so it gets CFS-throttled ~1% of periods. No CPU limit here (matches vmsingle/
    # vmagent): CPU is compressible and requests already guarantee scheduling.
    # Memory limit retained — incompressible, keep OOM protection. Sized to ~41m/50Mi
    # observed usage.
    resources:
      requests:
        cpu: 75m
        memory: 128Mi
      limits:
        memory: 256Mi
    # See the vmagent configReloaderResources note above for why this is per-CR.
    # Measured 7Mi. NOTE: unlike vmagent, this sidecar IS covered by a VPA container
    # policy (components/monitoring-vpa/resources/vpa-vmalert.yaml) in the default
    # RequestsAndLimits mode, so VPA scales this limit with the request instead of
    # pinning it at 64Mi. The container stays bounded either way, which is the point.
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi

# spec.secrets mounts the SealedSecret at /etc/vm/secrets/alertmanager-smtp/ (different
# path from prometheus-operator's Alertmanager at /etc/alertmanager/secrets/...).
alertmanager:
  enabled: true
  spec:
    useStrictSecurity: true # emptyDir …-db, no PVC (verified); see vmagent note above
    secrets:
      - alertmanager-smtp
    # Same rationale as vmalert above: drop the operator-default CPU limit (~36m)
    # that throttles alertmanager ~4% of periods during notify/gossip bursts.
    # No CPU limit; memory limit kept. Sized to ~4m/30Mi observed usage.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    # See the vmagent configReloaderResources note above. Measured 9Mi. Same VPA caveat
    # as vmalert: vpa-vmalertmanager.yaml controls this sidecar in RequestsAndLimits mode.
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.resend.com:587"
      smtp_from: "onboarding@resend.dev"
      smtp_auth_username: "resend"
      smtp_auth_password_file: /etc/vm/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: email
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        # InfoInhibitor is a kube-prometheus meta-alert that exists ONLY to inhibit info
        # alerts (see inhibit_rules below); it must be routed to null, not emailed.
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: mydellpc07@gmail.com
            send_resolved: true
    # Higher-severity alerts silence lower-severity ones for the same alertname/namespace.
    # InfoInhibitor mutes info-level alerts unless a warning/critical is also firing.
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: ["namespace", "alertname"]
      - source_matchers:
          - severity = "warning"
        target_matchers:
          - severity = "info"
        equal: ["namespace", "alertname"]
      - source_matchers:
          - alertname = "InfoInhibitor"
        target_matchers:
          - severity = "info"
        equal: ["namespace"]

defaultDatasources:
  victoriametrics:
    datasources:
      # uid "prometheus" so bundled kube-prometheus dashboards (${DS_PROMETHEUS}) and
      # Tempo's serviceMap.datasourceUid resolve without edits.
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        uid: prometheus
        isDefault: true
  extra:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      jsonData:
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Single replica + Recreate: SQLite session store can't be split across pods, and
  # RollingUpdate would deadlock on the already-attached RWO volume.
  replicas: 1
  persistence:
    enabled: true
    storageClassName: hcloud-volumes-encrypted
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  deploymentStrategy:
    type: Recreate
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      # Pinned by controlledValues: RequestsOnly in components/monitoring-vpa/resources/
      # vpa-grafana.yaml — edit both together or VPA ratio-preservation moves this ceiling.
      # MUST be >= the VPA maxAllowed memory (1Gi): maxAllowed caps the REQUEST only, so a
      # limit below it lets VPA drive request > limit, which the kubelet rejects.
      # Measured 177Mi for the grafana container alone.
      memory: 1Gi
  # One shared key that the chart applies to EVERY sidecar container (_pod.tpl uses
  # .Values.sidecar.resources for all of them). grafana-sc-dashboard and
  # grafana-sc-datasources measured 79Mi and 74Mi — they are the larger half of the pod's
  # 333Mi, not trivial sidecars. 256Mi stays above the 192Mi VPA maxAllowed set for them.
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  # Keep off: the Traefik compress middleware owns origin-side compression for all
  # routes; in-process gzip here would be redundant and would no-op that middleware.
  grafana.ini:
    server:
      enable_gzip: false
    # Grafana's own unified alerting is unused — there are zero alert rules here and
    # all alerting runs on vmalert + vmalertmanager. Disabling frees the UA scheduler/
    # state store (~20-60Mi) with no visibility loss (dashboards read from VM, not UA).
    unified_alerting:
      enabled: false
    # Stop background version-check + anonymous usage reporting (outbound calls, no value here).
    analytics:
      check_for_updates: false
      reporting_enabled: false

kube-state-metrics:
  enabled: true
  # Same shape as grafana: unbounded memory, and a VPA that was silently free to inflate
  # any limit. Pinned by controlledValues: RequestsOnly in vpa-kube-state-metrics.yaml.
  # 512Mi == that VPA's maxAllowed, so VPA can never push the request above the limit.
  # KSM memory tracks object count, so it grows with the cluster. Measured 77Mi.
  # No CPU limit, matching every other component here.
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 512Mi
  # VPA recommendations as custom-resource-state metrics. KSM auto-prefixes
  # kube_customresource_, yielding kube_customresource_vpa_containerrecommendations_*
  # which Grafana dashboard 14588 expects.
  rbac:
    extraRules:
      - apiGroups: ["autoscaling.k8s.io"]
        resources: ["verticalpodautoscalers"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: autoscaling.k8s.io
              version: v1
              kind: VerticalPodAutoscaler
            labelsFromPath:
              verticalpodautoscaler: [metadata, name]
              namespace: [metadata, namespace]
              target_api_version: [apiVersion]
              target_kind: [spec, targetRef, kind]
              target_name: [spec, targetRef, name]
            metrics:
              - name: vpa_containerrecommendations_target
                help: "VPA target resource recommendation per container."
                commonLabels: {resource: memory, unit: byte}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [target, memory]
              - name: vpa_containerrecommendations_target
                help: "VPA target resource recommendation per container."
                commonLabels: {resource: cpu, unit: core}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [target, cpu]
              - name: vpa_containerrecommendations_lowerbound
                help: "VPA lower bound recommendation per container."
                commonLabels: {resource: memory, unit: byte}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [lowerBound, memory]
              - name: vpa_containerrecommendations_lowerbound
                help: "VPA lower bound recommendation per container."
                commonLabels: {resource: cpu, unit: core}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [lowerBound, cpu]
              - name: vpa_containerrecommendations_upperbound
                help: "VPA upper bound recommendation per container."
                commonLabels: {resource: memory, unit: byte}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [upperBound, memory]
              - name: vpa_containerrecommendations_upperbound
                help: "VPA upper bound recommendation per container."
                commonLabels: {resource: cpu, unit: core}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [upperBound, cpu]
              - name: vpa_containerrecommendations_uncappedtarget
                help: "VPA uncapped target recommendation per container (ignores resourcePolicy)."
                commonLabels: {resource: memory, unit: byte}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [uncappedTarget, memory]
              - name: vpa_containerrecommendations_uncappedtarget
                help: "VPA uncapped target recommendation per container (ignores resourcePolicy)."
                commonLabels: {resource: cpu, unit: core}
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath: {container: [containerName]}
                    valueFrom: [uncappedTarget, cpu]

prometheus-node-exporter:
  enabled: true
  # The chart ships `resources: {}`, so node-exporter ran with NO request and NO limit.
  # That makes the pod BestEffort, and it carries no priorityClassName either — so the
  # kubelet evicts it FIRST under node memory pressure, losing node telemetry exactly
  # when the node is in trouble. A request alone moves it to Burstable and out of the
  # front of the eviction queue. Measured 17-25Mi across the three nodes; footprint is
  # flat (fixed collector set). There is no node-exporter VPA, so both values stay as
  # declared. The limit is deliberately loose at 128Mi (5x the measured peak): this is
  # the only change here that ADDS an OOM-kill path where none existed, and node-exporter
  # is what feeds the node-level alerts — a false kill blinds them. 128Mi is noise
  # against an 8GB node, so buy the headroom.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # extraArgs REPLACES the chart default list, so the chart's filesystem excludes are
  # repeated here alongside the netstat regex (extended with Ip_FragFails/Ip_ReasmFails —
  # direct MTU-misconfiguration indicators in the VXLAN+WireGuard overlay stack).
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
    - >-
      --collector.netstat.fields=^(.*_(InErrors|InErrs)|Ip_Forwarding|Ip_FragFails|Ip_ReasmFails|Ip(6|Ext)_(InOctets|OutOctets)|Icmp6?_(InMsgs|OutMsgs)|TcpExt_(Listen.*|Syncookies.*|TCPSynRetrans|TCPTimeouts|TCPOFOQueue|TCPRcvQDrop)|Tcp_(ActiveOpens|InSegs|OutSegs|OutRsts|PassiveOpens|RetransSegs|CurrEstab)|Udp6?_(InDatagrams|OutDatagrams|NoPorts|RcvbufErrors|SndbufErrors))$

# Drop intermediate le buckets and internal-only apiserver histograms. Providing
# .endpoints replaces the chart default list, so the TLS endpoint is re-stated below.
kubeApiServer:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: https
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
          metricRelabelConfigs:
            # Thin intermediate le buckets from the 4 main request-duration histograms.
            - action: drop
              sourceLabels: [__name__, le]
              regex: '(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?'
            # Drop internal histograms no dashboard or alert uses (~28k series from this job).
            - action: drop
              sourceLabels: [__name__]
              regex: 'apiserver_(request_body_size_bytes|response_sizes|watch_list_duration_seconds|watch_cache_read_wait_seconds|watch_events_sizes)_(bucket|sum|count)'

# k3s is a single binary: apiserver+etcd+scheduler+controller-manager all run in one
# process. Port 10250 /metrics exposes ALL embedded component metrics, so ~104k series
# would duplicate the kubeApiServer job without these drops. .vmScrape.spec.metricRelabelConfigs
# replaces the chart default list, so the 3 chart defaults are re-stated below.
kubelet:
  vmScrape:
    spec:
      metricRelabelConfigs:
        - action: labeldrop
          regex: (uid)
        - action: labeldrop
          regex: (id|name)
        - action: drop
          sourceLabels: [__name__]
          regex: 'rest_client_request_duration_seconds_(bucket|sum|count)'
        # Drop apiserver_* and etcd_* leaked via the k3s embedded binary; job="apiserver"
        # (kubeApiServer above) is the canonical source. Verified: 0 etcd sub-metrics are
        # exclusive to the kubelet job; no rule pins job="kubelet" for these.
        - action: drop
          sourceLabels: [__name__]
          regex: '(apiserver|etcd)_.*'

# k3s embeds these — no separate scrape targets exist.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
# k3s embeds etcd; its server metrics are on each control-plane node's internal IP at :2381 over
# PLAIN HTTP (etcd-expose-metrics, Phase 2a). We keep kubeEtcd.enabled=true ONLY to ship the etcd
# alert/recording RULES — the chart gates that rule group on kubeEtcd.enabled. The chart's own scrape
# path needs a manual Endpoints object, which ArgoCD's resource.exclusions drops (Endpoints/
# EndpointSlice are control-plane-managed) → 0 targets. So we suppress the chart's Service + Endpoints
# + VMServiceScrape (endpoints=[], service.enabled=false, vmScrape.enabled=false) and scrape the node
# IPs directly via the VMStaticScrape in extraObjects below (static targets need no Endpoints object).
kubeEtcd:
  enabled: true
  endpoints: []
  service:
    enabled: false
  vmScrape:
    enabled: false

# Re-ships the kube-prometheus dashboards + recording/alerting rules. Disable rule
# groups for components k3s does not expose, to avoid no-data panels and false alerts.
defaultDashboards:
  enabled: true

defaultRules:
  enabled: true
  groups:
    etcd:
      enabled: true
    kubeScheduler:
      enabled: false
    kubernetesSystemScheduler:
      enabled: false
    kubernetesSystemControllerManager:
      enabled: false

# Tempo's chart ServiceMonitor is disabled (hardcodes a dead jaeger-metrics endpoint
# that creates a 0-target false alert). This scrape targets the real metrics port only.
extraObjects:
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMServiceScrape
    metadata:
      name: tempo-metrics
      namespace: monitoring
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: tempo
          app.kubernetes.io/instance: tempo
      endpoints:
        - port: tempo-prom-metrics

  # etcd server health metrics (etcd_server_*, etcd_disk_*, etc.) live on each control-plane node
  # at :2381 (plain HTTP, etcd-expose-metrics from Phase 2a). Scraped as STATIC targets because the
  # node IPs are a host process (no Service/pod) and ArgoCD excludes Endpoints objects (see the
  # kubeEtcd note above). job=kube-etcd matches the etcd defaultRules' job=~".*etcd.*" selector.
  # These are the etcd-SERVER metrics; the apiserver job already carries the disjoint etcd-CLIENT
  # metrics (etcd_request_*, etcd_requests_total, …) — no overlap, no duplicate series.
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMStaticScrape
    metadata:
      name: kube-etcd
      namespace: monitoring
    spec:
      jobName: kube-etcd
      targetEndpoints:
        - targets:
            - "10.0.0.2:2381"
            - "10.0.0.3:2381"
            - "10.0.0.4:2381"
          scheme: http
