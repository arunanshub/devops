# Grafana dashboard for the arunanshu.dev app. The Grafana sidecar loads every ConfigMap
# with the grafana_dashboard label. Edit the JSON here, not in the Grafana UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arunanshu-dev-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  arunanshu-dev.json: |
    {
      "uid": "arunanshu-dev",
      "title": "arunanshu.dev",
      "tags": [
        "app",
        "arunanshu-dev"
      ],
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "timezone": "browser",
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": true,
            "name": "Deploys",
            "iconColor": "purple",
            "expr": "kube_replicaset_created{namespace=\"arunanshu-dev\", replicaset=~\"arunanshu-dev-.*\"} * 1000",
            "useValueForTime": true,
            "step": "1m",
            "titleFormat": "Deploy",
            "textFormat": "{{replicaset}}",
            "tagKeys": ""
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "prometheus"
            },
            "hide": 0
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_pod_info{namespace=\"arunanshu-dev\", created_by_kind=\"ReplicaSet\"}, pod)",
              "refId": "pod"
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Requests/s",
          "description": "Requests/s into the arunanshu.dev Traefik router. All status codes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(traefik_router_requests_total{router=~\"httproute-arunanshu-dev-.*\"}[$__rate_interval]))",
              "legendFormat": "",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "GET 200 p95 (range)",
          "description": "p95 of GET 200 for the selected time range. Traefik to pod only. Users also see Cloudflare RTT.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (increase(traefik_router_request_duration_seconds_bucket{router=~\"httproute-arunanshu-dev-.*\", code=\"200\", method=\"GET\"}[$__range])))",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.05
                  },
                  {
                    "color": "red",
                    "value": 0.2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "5xx ratio (range)",
          "description": "Share of 5xx responses for the selected time range.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(increase(traefik_router_requests_total{router=~\"httproute-arunanshu-dev-.*\", code=~\"5..\"}[$__range])) or vector(0)) / sum(increase(traefik_router_requests_total{router=~\"httproute-arunanshu-dev-.*\"}[$__range]))",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.001
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          }
        },
        {
          "type": "stat",
          "id": 5,
          "title": "Replicas ready / desired",
          "description": "Ready pods and the KEDA HPA desired count.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_status_replicas_ready{namespace=\"arunanshu-dev\", deployment=\"arunanshu-dev\"})",
              "legendFormat": "ready",
              "refId": "A",
              "range": false,
              "instant": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"arunanshu-dev\", horizontalpodautoscaler=\"keda-hpa-arunanshu-dev\"})",
              "legendFormat": "desired",
              "refId": "B",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          }
        },
        {
          "type": "gauge",
          "id": 6,
          "title": "Memory headroom used",
          "description": "Max working set of any pod as a share of its memory limit. The kernel OOM-kills the pod at 100%.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(container_memory_working_set_bytes{namespace=\"arunanshu-dev\", container=\"arunanshu-dev\", metrics_path=\"/metrics/cadvisor\"}) / max(kube_pod_container_resource_limits{namespace=\"arunanshu-dev\", container=\"arunanshu-dev\", resource=\"memory\"})",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdMarkers": true,
            "showThresholdLabels": false
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "Restarts + OOM kills (range)",
          "description": "Container restarts and OOM kills for the selected time range.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(increase(kube_pod_container_status_restarts_total{namespace=\"arunanshu-dev\", container=\"arunanshu-dev\"}[$__range])) or vector(0)) + (sum(increase(container_oom_events_total{namespace=\"arunanshu-dev\", container=\"arunanshu-dev\", metrics_path=\"/metrics/cadvisor\"}[$__range])) or vector(0))",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          }
        },
        {
          "type": "row",
          "id": 8,
          "title": "Traffic",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "Requests/s by status class",
          "description": "Stacked. Scanner traffic shows as 4xx.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (class) (label_replace(rate(traefik_router_requests_total{router=~\"httproute-arunanshu-dev-.*\"}[$__rate_interval]), \"class\", \"${1}xx\", \"code\", \"(.).*\"))",
              "legendFormat": "{{class}}",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 25,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisSoftMin": 0
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "2xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "3xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "4xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "5xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          }
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "Requests/s by method",
          "description": "POST requests are Next.js server actions.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (method) (rate(traefik_router_requests_total{router=~\"httproute-arunanshu-dev-.*\"}[$__rate_interval]))",
              "legendFormat": "{{method}}",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 6
          }
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "404 share",
          "description": "Share of 404 responses. Scanners cause most 404s. A high value does not mean real growth.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(traefik_router_requests_total{router=~\"httproute-arunanshu-dev-.*\", code=\"404\"}[$__rate_interval])) / sum(rate(traefik_router_requests_total{router=~\"httproute-arunanshu-dev-.*\"}[$__rate_interval]))",
              "legendFormat": "404 share",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 6
          }
        },
        {
          "type": "row",
          "id": 12,
          "title": "Latency (Traefik to pod)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 13,
          "title": "GET 200 latency",
          "description": "p50, p95 and p99 of GET 200. Traefik to pod only. Users also see Cloudflare RTT. Buckets end at 1s, so values above 1s show as 1s.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~\"httproute-arunanshu-dev-.*\", code=\"200\", method=\"GET\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~\"httproute-arunanshu-dev-.*\", code=\"200\", method=\"GET\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B",
              "range": true,
              "instant": false,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~\"httproute-arunanshu-dev-.*\", code=\"200\", method=\"GET\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C",
              "range": true,
              "instant": false,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "interval": "5m",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          }
        },
        {
          "type": "timeseries",
          "id": 14,
          "title": "POST latency (server actions)",
          "description": "p50 and p95 of POST. Traefik to pod only. Users also see Cloudflare RTT. Buckets end at 1s, so values above 1s show as 1s.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~\"httproute-arunanshu-dev-.*\", method=\"POST\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~\"httproute-arunanshu-dev-.*\", method=\"POST\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B",
              "range": true,
              "instant": false,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
