fullnameOverride: kube-prometheus-stack

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      jsonData:
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus

  # persist Grafana data in the hetzner volume instead of emptyDir to persist
  # data across pod restarts
  deploymentStrategy:
    type: Recreate

  persistence:
    enabled: true
    storageClassName: hcloud-volumes-encrypted
    accessModes: ["ReadWriteOnce"]
    size: 10Gi

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 25m
      memory: 384Mi

prometheus:
  ingress:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: null
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow

  verticalPodAutoscaler:
    enabled: true
    minAllowed:
      cpu: 100m
      memory: 512Mi
    maxAllowed:
      cpu: 2
      memory: 4Gi
    updatePolicy:
      # in-place avoids operator fight; recreate fallback is limited
      updateMode: InPlaceOrRecreate

  prometheusSpec:
    externalUrl: https://prometheus.arunanshu.dev
    enableRemoteWriteReceiver: true
    retention: 14d
    retentionSize: 8GiB
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # store in the hetzner volume instead of emptyDir to persist data across pod
    # restarts
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes-encrypted
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  ingress:
    enabled: false

  enabled: true
  alertmanagerSpec:
    retention: 120h
    # Mount the SealedSecret into the Alertmanager pod
    secrets:
      - alertmanager-smtp
    # store in the hetzner volume instead of emptyDir to persist data across pod
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes-encrypted
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.resend.com:587"
      smtp_from: "onboarding@resend.dev"
      smtp_auth_username: "resend"
      # File path is /etc/alertmanager/secrets/<secret-name>/<key>
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true

    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "email"
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"

    receivers:
      - name: "null"
      - name: "email"
        email_configs:
          - to: "mydellpc07@gmail.com" # ← your actual email
            send_resolved: true

prometheus-node-exporter:
  extraArgs:
    # Default netstat fields regex extended with Ip_FragFails and Ip_ReasmFails.
    # Ip_FragFails = packets with DF bit set dropped because they exceeded path MTU.
    # Ip_ReasmFails = fragmented packets that arrived but failed reassembly.
    # Both are direct indicators of MTU misconfiguration in the overlay stack.
    - >-
      --collector.netstat.fields=^(.*_(InErrors|InErrs)|Ip_Forwarding|Ip_FragFails|Ip_ReasmFails|Ip(6|Ext)_(InOctets|OutOctets)|Icmp6?_(InMsgs|OutMsgs)|TcpExt_(Listen.*|Syncookies.*|TCPSynRetrans|TCPTimeouts|TCPOFOQueue|TCPRcvQDrop)|Tcp_(ActiveOpens|InSegs|OutSegs|OutRsts|PassiveOpens|RetransSegs|CurrEstab)|Udp6?_(InDatagrams|OutDatagrams|NoPorts|RcvbufErrors|SndbufErrors))$

prometheusOperator:
  admissionWebhooks:
    patch:
      # "hook-succeeded" (chart default) deletes the job immediately after completion,
      # before ArgoCD can observe the Complete condition — causing infinite sync retries.
      # "before-hook-creation" keeps the completed job until the next sync, giving
      # ArgoCD time to register success.
      hookDeletePolicy: before-hook-creation

# embedded etcd runs inside the k3s server process, not as a visible static pod like kubeadm
kubeEtcd:
  enabled: false

# disable these since we run k3s which doesn't have these components
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    etcd: false

kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: ["autoscaling.k8s.io"]
        resources: ["verticalpodautoscalers"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: autoscaling.k8s.io
              version: v1
              kind: VerticalPodAutoscaler
            # No metricNamePrefix — KSM auto-applies kube_customresource_ prefix,
            # producing kube_customresource_vpa_containerrecommendations_* which
            # is exactly what Grafana dashboard 14588 expects.
            labelsFromPath:
              verticalpodautoscaler: [metadata, name]
              namespace: [metadata, namespace]
              target_api_version: [apiVersion]
              target_kind: [spec, targetRef, kind]
              target_name: [spec, targetRef, name]
            metrics:
              - name: vpa_containerrecommendations_target
                help: "VPA target resource recommendation per container."
                commonLabels:
                  resource: memory
                  unit: byte
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, memory]
              - name: vpa_containerrecommendations_target
                help: "VPA target resource recommendation per container."
                commonLabels:
                  resource: cpu
                  unit: core
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, cpu]
              - name: vpa_containerrecommendations_lowerbound
                help: "VPA lower bound recommendation per container."
                commonLabels:
                  resource: memory
                  unit: byte
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [lowerBound, memory]
              - name: vpa_containerrecommendations_lowerbound
                help: "VPA lower bound recommendation per container."
                commonLabels:
                  resource: cpu
                  unit: core
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [lowerBound, cpu]
              - name: vpa_containerrecommendations_upperbound
                help: "VPA upper bound recommendation per container."
                commonLabels:
                  resource: memory
                  unit: byte
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [upperBound, memory]
              - name: vpa_containerrecommendations_upperbound
                help: "VPA upper bound recommendation per container."
                commonLabels:
                  resource: cpu
                  unit: core
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [upperBound, cpu]
              - name: vpa_containerrecommendations_uncappedtarget
                help: "VPA uncapped target recommendation per container (ignores resourcePolicy)."
                commonLabels:
                  resource: memory
                  unit: byte
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [uncappedTarget, memory]
              - name: vpa_containerrecommendations_uncappedtarget
                help: "VPA uncapped target recommendation per container (ignores resourcePolicy)."
                commonLabels:
                  resource: cpu
                  unit: core
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [uncappedTarget, cpu]
