# kube-prometheus-stack is NEUTERED: it now exists ONLY to provide the
# prometheus-operator CRD definitions (servicemonitors / podmonitors / prometheusrules /
# probes / scrapeconfigs / ...). Those CRDs are still required because third-party charts
# (cilium, traefik, keda, tempo, cloudflared, hcloud-ccm) emit ServiceMonitor/PodMonitor
# objects, which the VictoriaMetrics operator converts to VM-native scrapes. All actual
# monitoring workloads now run on VictoriaMetrics — see victoria-metrics-k8s-stack/ and
# docs/victoriametrics-migration.md.
#
# ⚠️  DO NOT delete this Application. Pruning it would delete the prometheus-operator CRDs,
# and Kubernetes garbage-collects every CR of a kind when its CRD is deleted — that would
# cascade-delete every ServiceMonitor/PodMonitor/PrometheusRule cluster-wide and blind
# vmagent. Disabling the workloads (below) while keeping crds.enabled lets normal sync prune
# only the workloads; the CRDs stay explicitly desired and are never prune candidates.
#
# Follow-up: replace this neutered chart with the dedicated prometheus-operator-crds chart
# (see the migration doc) once the VM stack has settled.

fullnameOverride: kube-prometheus-stack

# The whole reason this chart is retained — keep the CRDs.
crds:
  enabled: true

# All workloads moved to VictoriaMetrics (victoria-metrics-k8s-stack).
prometheus:
  enabled: false
alertmanager:
  enabled: false
grafana:
  enabled: false
prometheusOperator:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false

# The VM chart re-ships the kube-prometheus mixin recording/alerting rules; disabling here
# avoids duplicate rules (the VM operator would otherwise also convert these to VMRules).
defaultRules:
  create: false

# Disable ALL kube-* scrape components so this chart emits ZERO ServiceMonitors (truly
# CRD-only). Otherwise the chart defaults (kubeControllerManager/Scheduler/Etcd enabled)
# would create ServiceMonitors for control-plane components k3s doesn't expose → scrapes
# with 0 discovered targets → false "0 discovered targets" alerts. kubelet/apiserver/coredns
# scrapes are provided natively by the VM chart, so disable them here too to avoid duplicates.
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
