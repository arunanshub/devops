apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - prometheus.arunanshu.dev
  rules:
    # vmsingle serves its UI (vmui) and the Prometheus-compatible API on :8428.
    # The previous /assets/ cache rule was Prometheus-UI-specific; vmui serves under
    # /vmui/ and sets its own asset cache headers, so it's dropped.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: vmsingle-victoria-metrics-k8s-stack
          port: 8428
          weight: 1
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: compress
