apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - grafana.arunanshu.dev
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
