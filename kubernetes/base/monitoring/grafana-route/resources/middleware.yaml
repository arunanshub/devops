apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: monitoring
  # base/monitoring/prometheus-route also references this Middleware. Do not
  # move or rename it without updating that HTTPRoute.
spec:
  compress:
    # Traefik uses only an encoding that the client advertises. The order sets
    # the priority. Cloudflare sends `Accept-Encoding: br, gzip` today, so
    # brotli wins and zstd stays inert. zstd leads the list for the day
    # Cloudflare adds it.
    encodings: [zstd, br, gzip]
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/wasm
      - image/svg+xml
