apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: monitoring
spec:
  compress:
    # Cloudflare normalizes origin requests to `Accept-Encoding: br, gzip`.
    # Compress that hop with the best mutually supported encoding; Cloudflare may
    # preserve it or transcode it for the external client.
    encodings: [br, gzip]
    minResponseBodyBytes: 1024
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - image/svg+xml
