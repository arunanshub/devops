fullnameOverride: tempo

tempo:
  reportingEnabled: false
  retention: 48h

  # Container-level hardening (the chart's pod-level securityContext already runs tempo as
  # non-root uid 10001). Drop-ALL-caps + no-priv-esc + seccomp RuntimeDefault — pure-additive,
  # zero-risk. readOnlyRootFilesystem is deliberately NOT set: the chart's own values comment
  # warns it breaks the single-binary tempo, and tempo writes WAL/traces/metrics under the PVC
  # mount anyway. Keeps tempo consistent with the now-hardened VM stateless components.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 50m
      # Safe WAL-replay floor. VPA may raise this request and the proportional
      # limit, but must never shrink Tempo back into the 512Mi OOM loop.
      memory: 640Mi
    limits:
      memory: 1Gi

  # Keep Go heap below the minimum 1Gi cgroup limit, leaving headroom for WAL replay, mmap,
  # stacks, and metrics-generator buffers. STATIC BY DESIGN: the tempo VPA runs
  # RequestsAndLimits (InPlaceOrRecreate) to give WAL-replay OOM headroom, so it can raise the
  # cgroup limit past 1Gi — but we intentionally do NOT track it (unlike traefik/vmsingle which
  # use RequestsOnly + resourceFieldRef). Switching tempo to RequestsOnly would surrender that
  # OOM headroom; wiring GOMEMLIMIT from limits.memory yields raw bytes = 100% of limit, unsafe
  # given the non-heap headroom tempo needs. GOMEMLIMIT is a SOFT target (Go throttles GC, no
  # hard OOM), so a stale-high limit only wastes GC CPU during rare trace-burst limit-raises —
  # acceptable on this CPU-idle, near-idle-trace cluster.
  extraEnv:
    - name: GOMEMLIMIT
      value: 800MiB

  # Only accept OTLP — drop jaeger/opencensus to reduce attack surface
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/write"
    processor:
      service_graphs:
        wait: 10s
        max_items: 10000
    storage:
      path: /var/tempo/metrics

  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs

# Disabled: the tempo chart's ServiceMonitor hardcodes a second endpoint for a
# "jaeger-metrics" port that this OTLP-only Tempo doesn't expose, producing a scrape pool
# with 0 discovered targets (false alert). Replaced by a single-endpoint VMServiceScrape
# defined in victoria-metrics-k8s-stack values (extraObjects) targeting only tempo-prom-metrics.
serviceMonitor:
  enabled: false

persistence:
  enabled: true
  storageClassName: hcloud-volumes-encrypted
  accessModes:
    - ReadWriteOnce
  size: 10Gi
