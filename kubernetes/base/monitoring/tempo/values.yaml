fullnameOverride: tempo

tempo:
  reportingEnabled: false
  memBallastSizeMbs: 128
  retention: 48h

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

  # Only accept OTLP — drop jaeger/opencensus to reduce attack surface
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/write"
    processor:
      service_graphs:
        wait: 10s
        max_items: 10000
      local_blocks:
        flush_to_storage: true
        filter_server_spans: false
        max_block_duration: 5m
    storage:
      path: /var/tempo/metrics
    traces_storage:
      path: /var/tempo/metrics-wal

  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - local-blocks

# Disabled: the tempo chart's ServiceMonitor hardcodes a second endpoint for a
# "jaeger-metrics" port that this OTLP-only Tempo doesn't expose, producing a scrape pool
# with 0 discovered targets (false alert). Replaced by a single-endpoint VMServiceScrape
# defined in victoria-metrics-k8s-stack values (extraObjects) targeting only tempo-prom-metrics.
serviceMonitor:
  enabled: false

persistence:
  enabled: true
  storageClassName: hcloud-volumes-encrypted
  accessModes:
    - ReadWriteOnce
  size: 10Gi
