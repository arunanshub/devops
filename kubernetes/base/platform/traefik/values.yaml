global:
  # Renovate and GitOps own upgrades. Disable Traefik's daily outbound version
  # check so the enforced egress policy does not generate expected drops.
  checkNewVersion: false

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.arunanshu.dev`)

providers:
  kubernetesGateway:
    enabled: true
  # Gateway API owns HTTP routing. Keep the CRD provider for Middleware
  # ExtensionRefs, but do not watch or claim Kubernetes Ingress resources.
  kubernetesIngress:
    enabled: false

ingressClass:
  enabled: false

gateway:
  listeners:
    web:
      # Route publication is an edge-security boundary. Restrict this shared
      # listener to the namespaces that already own its accepted HTTPRoutes;
      # `kubernetes.io/metadata.name` is an immutable label on every Namespace.
      namespacePolicy:
        from: Selector
        selector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
                - arunanshu-dev
                - argocd
                - headlamp
                - kube-system
                - monitoring
                - traefik

service:
  spec:
    type: ClusterIP

# KEDA owns replicas. VPA manages requests only, so the 1Gi memory limit remains
# fixed. Let the chart set GOMEMLIMIT to 90% of that limit and retain headroom for
# memory that the Go runtime does not control.
deployment:
  replicas: null

# KEDA holds a minimum of 2 replicas. Let a node drain remove one pod.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Keep accepting on the web entry point for 5s after SIGTERM while routing
# components stop selecting the pod. Then give active requests 50s to finish.
# The chart renders a 60s pod termination period, which leaves 5s for exit.
# web (:8000) is the live traffic entry point behind cloudflared.
ports:
  # Publish the API and dashboard port on the chart Service. An HTTPRoute then
  # routes external traffic through the Access-gated tunnel. The Service is
  # ClusterIP, so the port stays inside the cluster.
  traefik:
    expose:
      default: true
  web:
    transport:
      lifeCycle:
        requestAcceptGraceTimeout: "5s"
        graceTimeOut: "50s"
  # No Gateway listener, tunnel origin, or Cilium allow rule uses HTTPS on
  # :8443. Keep the chart's listener default but do not publish dead Service
  # port 443 inside the cluster.
  websecure:
    expose:
      default: false

# Buffered, error-only JSON access logs make 4xx/5xx requests available in Loki
# with low steady-state log volume. Chart 41 uses the upstream accessLog syntax.
accessLog:
  enabled: true
  format: json
  bufferingSize: 100
  filters:
    statusCodes: "400-599"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    # Two minimum replicas must not share one node. maxSkew still permits five
    # replicas across the three-node cluster.
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik

resources:
  requests:
    cpu: 10m
    memory: 32Mi # conservative floor, slightly above idle 23Mi
  limits:
    # Honest fixed ceiling. VPA is RequestsOnly (traefik-scaling/resources/vpa.yaml), so it
    # no longer inflates this via ratio preservation. 1Gi sits above the measured 674Mi
    # load peak. The chart sets GOMEMLIMIT to 90% of this value. No CPU limit intentionally.
    memory: 1Gi

tracing:
  # Keep coherent end-to-end traces without allowing traffic tests to flood
  # the single-binary Tempo ingester and metrics generator.
  sampleRate: 0.05
  otlp:
    enabled: true
    http:
      enabled: true
      endpoint: http://tempo.monitoring.svc.cluster.local:4318/v1/traces

metrics:
  prometheus:
    # Chart default, but load-bearing. The traefik-scaling KEDA trigger reads
    # traefik_service_requests_total, which this label set produces.
    addServicesLabels: true
    # Not a chart default. The arunanshu-dev KEDA trigger reads
    # traefik_router_request_duration_seconds_sum, which needs router metrics.
    addRoutersLabels: true
    # Chart default buckets are "0.1,0.3,1.2,5.0" — our request durations are
    # single-digit ms, so p50/p95 collapse into the first bucket and latency SLO
    # dashboards are blind below 100ms. Add sub-100ms resolution.
    buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1.0"
    service:
      enabled: true # creates a dedicated metrics Service
    serviceMonitor:
      enabled: true
      # KEDA scales from these router metrics. Fifteen seconds cuts the dominant
      # observation delay while retaining four samples in its 1m rate window.
      interval: "15s"
