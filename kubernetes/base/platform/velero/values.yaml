nodeAgent:
  enabled: false

# Harden the velero server container (cluster-admin SA, reads every Secret during
# backup): drop ALL caps + no privilege escalation. Applies to the velero
# deployment AND the upgrade-crds hook job (same image).
# runAsNonRoot NOT set: velero v1.18 is a buildpacks image with a non-numeric
# USER (cnb), so kubelet can't verify non-root → CreateContainerConfigError. The
# image already runs as the non-root cnb user by default, so the guard is moot.
# readOnlyRootFilesystem NOT set: velero stages backup/restore data to writable
# scratch paths; flipping it risks silently breaking backups.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.12.0
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: arunanshu-velero-backups
      credential:
        name: velero-r2-credentials
        key: cloud
      config:
        region: auto
        # Replace 'placeholder' with your R2 account ID: sops exec-env infra/secrets.yaml 'echo $R2_ACCOUNT_ID'
        s3Url: "https://2f120b3588f24bba8666100a3da52e02.r2.cloudflarestorage.com"
        s3ForcePathStyle: "true"
        checksumAlgorithm: ""

  volumeSnapshotLocation: []

schedules:
  daily-full:
    schedule: "0 2 * * *"
    template:
      ttl: 720h
      includedNamespaces:
        - "*"
      includeClusterResources: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true

credentials:
  useSecret: true
  existingSecret: velero-r2-credentials
