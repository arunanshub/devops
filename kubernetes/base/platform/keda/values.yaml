prometheus:
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: true

  operator:
    enabled: true
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: true

  webhooks:
    enabled: true
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: true

# Right-size KEDA control-plane pods. Chart defaults set a 1000Mi memory limit
# on each (operator, metrics apiserver, webhooks) — ~3Gi of phantom limits for
# pods that idle at tens of MiB, which inflates node limit-commit and defeats
# limits as a node-protection signal. No CPU limits, matching house style.
resources:
  operator:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  metricServer:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  webhooks:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
