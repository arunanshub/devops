apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: arunanshu-dev
  namespace: arunanshu-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arunanshu-dev
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
