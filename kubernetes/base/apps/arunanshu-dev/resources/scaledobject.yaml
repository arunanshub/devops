apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: arunanshu-dev
  namespace: arunanshu-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arunanshu-dev
  minReplicaCount: 2
  # Scale horizontally (Next.js is single-threaded); 8 replicas fits the node budget.
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 60
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
        metricName: arunanshu_dev_rps
        # KEDA's HPA is AverageValue (divides by replica count), so query must be the
        # raw total RPS — pre-dividing double-counts and under-scales. threshold is
        # the per-replica RPS target.
        query: |
          sum(rate(traefik_router_requests_total{router=~"httproute-arunanshu-dev.*"}[1m]))
        threshold: "50"
