apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: arunanshu-dev
  namespace: arunanshu-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arunanshu-dev
  minReplicaCount: 2
  # Scale horizontally (Next.js is single-threaded); 8 replicas fits the node budget.
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 60
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp: # React on the first metric update and add capacity quickly.
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100 # Double the replica count...
              periodSeconds: 15
            - type: Pods
              value: 4 # ...or add four pods, whichever is larger.
              periodSeconds: 15
        scaleDown: # Hold spare capacity after a burst and remove one pod at a time.
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
        metricName: arunanshu_dev_concurrency
        query: |
          sum(rate(traefik_router_request_duration_seconds_sum{router=~"httproute-arunanshu-dev.*"}[1m]))
        # Provisional value: 27% below the highest healthy HEAD concurrency
        # observed on 2026-07-11 (0.547 per pod). The test did not find a knee.
        threshold: "0.4"
