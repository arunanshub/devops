apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: arunanshu-dev
  namespace: arunanshu-dev
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arunanshu-dev
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: arunanshu-dev
        minAllowed:
          cpu: 10m
          memory: 64Mi
        maxAllowed:
          # 1 core: Next.js is single-threaded — capacity comes from replicas, not
          # bigger pods. Just enough headroom so one pod isn't starved mid-render.
          cpu: 1
          memory: 512Mi
