apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: arunanshu-dev
  namespace: arunanshu-dev
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arunanshu-dev
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: arunanshu-dev
        minAllowed:
          cpu: 10m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
