apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: arunanshu-dev
  namespace: arunanshu-dev
spec:
  selector:
    matchLabels:
      app: arunanshu-dev
  endpoints:
    - port: metrics # references the Service port NAME, not the number
      path: /metrics
      # interval omitted — inherits vmagent global scrapeInterval (30s)
