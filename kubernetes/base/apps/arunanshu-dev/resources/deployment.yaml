apiVersion: apps/v1
kind: Deployment
metadata:
  name: arunanshu-dev
  namespace: arunanshu-dev
spec:
  selector:
    matchLabels:
      app: arunanshu-dev
  # maxUnavailable: 0 ensures the old pod stays alive until the new pod is
  # fully ready. Combined with minReadySeconds below, this gives the CF edge
  # cache time to warm new /_next/static/ chunk hashes (content-addressed)
  # before the old pod is terminated, closing the skew window where a browser
  # gets new HTML (new chunk hashes) but CF round-robins a cold miss to the
  # old pod (which doesn't have those hashes).
  # deploymentId + NEXT_DEPLOYMENT_ID (baked at build time) handles the RSC /
  # server-action layer independently — this only covers static bundle loading.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  minReadySeconds: 30
  template:
    metadata:
      labels:
        app: arunanshu-dev
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: arunanshu-dev
      containers:
        - name: arunanshu-dev
          image: arunanshu-dev
          ports:
            - containerPort: 3000
              protocol: TCP
            # Private metrics side port served by instrumentation.ts (prom-client).
            # Intentionally absent from httproute.yaml — in-cluster scrape only.
            - containerPort: 9091
              name: metrics
              protocol: TCP
          env:
            # Tempo OTLP HTTP receiver (tempo-otlp-http port on the tempo svc);
            # 3200 is the query API, NOT ingest. @vercel/otel reads these OTEL_*
            # vars and appends /v1/traces.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            # Bound overhead/ingest on small nodes — head sampling at 25%.
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          # Lenient probes: don't kill or flap a busy-but-alive pod under load
          # (that drops capacity mid-hug and cascades). 5s timeout vs the 1s default.
          livenessProbe:
            httpGet:
              path: /favicon.ico
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # VPA recommended ~335Mi after the 2026-07-11 load test. Keep a
              # safe declarative floor if VPA admission or updates lag.
              memory: 384Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
