apiVersion: apps/v1
kind: Deployment
metadata:
  name: arunanshu-dev
  namespace: arunanshu-dev
spec:
  selector:
    matchLabels:
      app: arunanshu-dev
  # maxUnavailable: 0 ensures the old pod stays alive until the new pod is
  # fully ready. Combined with minReadySeconds below, this gives the CF edge
  # cache time to warm new /_next/static/ chunk hashes (content-addressed)
  # before the old pod is terminated, closing the skew window where a browser
  # gets new HTML (new chunk hashes) but CF round-robins a cold miss to the
  # old pod (which doesn't have those hashes).
  # deploymentId + NEXT_DEPLOYMENT_ID (baked at build time) handles the RSC /
  # server-action layer independently — this only covers static bundle loading.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 30
  template:
    metadata:
      labels:
        app: arunanshu-dev
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: arunanshu-dev
      containers:
        - name: arunanshu-dev
          image: arunanshu-dev
          ports:
            - containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          livenessProbe:
            httpGet:
              path: /favicon.ico
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
