apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: arunanshu-dev
spec:
  compress:
    # NOTE: Cloudflare requests content from the origin with `Accept-Encoding: br, gzip`
    # (never zstd — not supported end-to-end as of 2025). So on the CF path Traefik
    # always serves br here; the zstd entry only fires for a direct, non-CF client.
    encodings: [zstd, br, gzip]
    defaultEncoding: zstd
    minResponseBodyBytes: 512
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - image/svg+xml
      - text/x-component # Next.js RSC payloads
