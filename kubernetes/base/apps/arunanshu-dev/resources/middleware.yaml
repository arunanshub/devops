apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: arunanshu-dev
spec:
  compress:
    encodings: [br, zstd, gzip]
    defaultEncoding: br
    minResponseBodyBytes: 56
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - image/svg+xml
      - application/octet-stream
      - text/event-stream
      - text/x-component
