apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arunanshu-dev
  namespace: argocd
  annotations:
    # Wave 1: this app ships a KEDA ScaledObject; KEDA (wave 0) must register its
    # CRDs first or the ScaledObject apply fails on a clean bootstrap.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps

  source:
    repoURL: git@github.com:arunanshub/devops.git
    targetRevision: HEAD
    path: kubernetes/base/apps/arunanshu-dev/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: arunanshu-dev

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: arunanshu-dev
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
