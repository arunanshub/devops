apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: libby-hbd-2026
spec:
  compress:
    # Order sets priority. CF sends `br, gzip` today so brotli wins; zstd
    # leads for the day CF adds it.
    encodings: [zstd, br, gzip]
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - image/svg+xml
      - text/x-component # Next.js RSC payloads
