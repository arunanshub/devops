apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: libby-hbd-2026
  namespace: libby-hbd-2026
spec:
  selector:
    matchLabels:
      app: libby-hbd-2026
  endpoints:
    - port: metrics # references the Service port NAME, not the number
      path: /metrics
      # interval omitted — inherits vmagent global scrapeInterval (30s)
