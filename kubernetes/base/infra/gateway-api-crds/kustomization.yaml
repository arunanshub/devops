# Gateway API standard channel CRDs for ArgoCD steady-state reconciliation.
# Keep this intentionally separate from kubernetes/bootstrap/gateway-api-crds
# so bootstrap and ArgoCD ownership can evolve independently.
#
# Traefik owns the GatewayClass; Cilium Gateway API is disabled. Bump this
# version in sync with kubernetes/bootstrap/gateway-api-crds/kustomization.yaml,
# validating against the Traefik minor version's Gateway API support matrix.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml
