# Must render to the same manifests as kubernetes/bootstrap/values/cilium.yaml.gotmpl
# at bootstrap time, otherwise ArgoCD's first reconcile under ServerSideApply
# will mutate Cilium resources.

kubeProxyReplacement: true

# Private IP of the API server load balancer from infra/locals.tf.
k8sServiceHost: 10.0.0.100
k8sServicePort: 6443

ipam:
  mode: kubernetes

# VXLAN tunnel mode keeps cross-node pod traffic independent of Hetzner
# Cloud Network pod-CIDR routing. This matches bootstrap values exactly.
routingMode: tunnel
tunnelProtocol: vxlan

# MTU is left at the default (0 = auto-detect from enp7s0 = 1450).
# Cilium's MTU param is the physical device MTU, not the pod MTU.
# Setting it lower shrinks cilium_wg0 too aggressively and breaks the VXLAN path.
# Path MTU enforcement for UDP/ICMP is handled by pmtuDiscovery below.

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true
  wireguard:
    # Sends a keepalive every 25s so WireGuard sessions survive idle periods
    # on Hetzner's private network without re-handshaking under load.
    persistentKeepalive: 25s

# Use eBPF instead of iptables for masquerading egress traffic.
# Safe with kubeProxyReplacement: true; removes the iptables NAT fallback.
bpf:
  masquerade: true

# Send ICMP "Fragmentation Needed" back on oversized packets instead of
# silently blackholing them. After setting MTU: 1320 this should never fire,
# fire, but if it does, applications will see an explicit error.
pmtuDiscovery:
  enabled: true
  packetizationLayerPMTUDMode: "always"

# Force stale Helm-adoption keys off. With ServerSideApply, absent ConfigMap
# keys from the desired render do not reliably prune keys previously owned by
# helmfile's bootstrap release.
extraConfig:
  enable-gateway-api: "false"
  enable-gateway-api-secrets-sync: "false"

resources:
  requests:
    cpu: 100m
    memory: 320Mi

# Policies evaluate but violations are logged as AUDIT instead of being
# dropped. Disable once all namespace policies have been validated via Hubble.
policyAuditMode: true

operator:
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 160Mi
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

envoy:
  resources:
    requests:
      cpu: 25m
      memory: 100Mi

# Expose cilium-agent metrics and register a ServiceMonitor so Prometheus
# scrapes them automatically.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

# TODO: enable cilium GAPI once it has support for ClusterIP type in CiliumGatewayClassConfig.
# ref: https://claude.ai/share/589a7ce8-eea1-4043-aaab-69d4d6ee9333
gatewayAPI:
  enabled: false
  # gatewayClass:
  #   create: "true"

# Use host's cgroup2 mount; avoids the duplicate /run/cilium/cgroupv2 mount
# and gives Hubble full host cgroup tree visibility.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Hubble Relay aggregates flows; UI exposes a web visualizer.
# certgen CronJob manages cilium-ca and hubble-server-certs (not Helm's genCA)
# for deterministic ArgoCD renders; rotates every 4 months, hot-reloaded.
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  tls:
    auto:
      method: cronJob
  metrics:
    # Drop visibility is the most important: surfaces MTU issues, policy
    # violations, and any other silent packet loss via hubble_drop_total.
    # Flow uses namespace-level context to keep cardinality manageable.
    enabled:
      - drop
      - tcp
      - "flow:sourceContext=namespace;destinationContext=namespace"
      - icmp
      - "dns:query;ignoreAAAA"
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
      namespace: monitoring
