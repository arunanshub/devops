# Must render to the same manifests as kubernetes/bootstrap/values/cilium.yaml.gotmpl
# at bootstrap time, otherwise ArgoCD's first reconcile under ServerSideApply
# will mutate Cilium resources.

kubeProxyReplacement: true

# Private IP of the API server load balancer from infra/locals.tf.
k8sServiceHost: 10.0.0.100
k8sServicePort: 6443

ipam:
  mode: kubernetes

# VXLAN tunnel mode keeps cross-node pod traffic independent of Hetzner
# Cloud Network pod-CIDR routing. This matches bootstrap values exactly.
routingMode: tunnel
tunnelProtocol: vxlan

# Preserve networking on two nodes while the Cilium DaemonSet rolls. The
# chart default allows two agents to be unavailable at once.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# MTU is left at the default (0 = auto-detect from enp7s0 = 1450).
# Cilium's MTU param is the physical device MTU, not the pod MTU.
# Setting it lower shrinks cilium_wg0 too aggressively and breaks the VXLAN path.
# Path MTU enforcement for UDP/ICMP is handled by pmtuDiscovery below.

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true
  wireguard:
    # Sends a keepalive every 25s so WireGuard sessions survive idle periods
    # on Hetzner's private network without re-handshaking under load.
    persistentKeepalive: 25s
  # WireGuard strict mode — fail CLOSED. Beyond "encrypt eligible traffic", this
  # DROPS any cross-node pod-to-pod packet (src AND dst both in the pod CIDR) that
  # appears in plaintext, instead of letting it through. Guards against transient
  # key-distribution gaps, broken WireGuard state, and plaintext injection/spoofing.
  # Pods here are IPv4-only (cluster-cidr = k3s default 10.42.0.0/16, no dual-stack —
  # all IPv6 in this cluster is node-transport/SAN only), so IPv4 strict egress is a
  # COMPLETE no-plaintext guarantee, not the partial dual-stack case. Same-node pod
  # traffic stays plaintext by design (never crosses the WireGuard boundary).
  # allowRemoteNodeIdentities: REQUIRED under VXLAN tunnel mode — exempts traffic
  # classified with Cilium's remote-node identity inside the strict CIDR.
  # Directional keys verified against chart v1.20.0-pre.4 values.yaml (flat
  # strictMode.enabled/.cidr are deprecated). Doc:
  # https://docs.cilium.io/en/stable/security/network/encryption-wireguard/
  #
  # OPERATOR PRE-MERGE GATES (both require cluster access):
  #   1. `cilium encryption status` healthy on all 3 nodes BEFORE merge — if a node's
  #      WireGuard is down, strict mode drops its cross-node pod traffic (partial outage).
  #   2. Enabling INGRESS strict mode briefly disrupts inter-node pod delivery during
  #      the agent rollout. Reconcile during low traffic; then confirm no unexpected
  #      plaintext with `hubble observe --unencrypted` (should be empty).
  strictMode:
    egress:
      enabled: true
      cidr: "10.42.0.0/16"
      allowRemoteNodeIdentities: true
    ingress:
      enabled: true

# Use eBPF instead of iptables for masquerading egress traffic.
# Safe with kubeProxyReplacement: true; removes the iptables NAT fallback.
bpf:
  masquerade: true

# BandwidthManager (MQ/FQ qdiscs + EDT pacing) + BBR congestion control for pods.
# BBR helps the high-RTT internet egress path (cloudflared/traefik/webapp); requires
# eBPF host-routing (on) + kernel >=5.18 (6.8). Applies to NEW sockets only — existing
# pods flip on their next restart. Orthogonal to VXLAN+WireGuard. Revert = both keys
# false + rolling per-node `kubectl -n kube-system delete pod -l k8s-app=cilium`
# (qdisc/sysctl persist until node reboot, benign). Verify: `just verify-mtu` + cilium status.
bandwidthManager:
  enabled: true
  bbr: true

# Send ICMP "Fragmentation Needed" back on oversized packets instead of
# silently blackholing them, so applications see an explicit error and can
# retry with a smaller payload. See docs/cilium-mtu-overlay-networking.md.
pmtuDiscovery:
  enabled: true
  packetizationLayerPMTUDMode: "always"

# Force stale Helm-adoption keys off. With ServerSideApply, absent ConfigMap
# keys from the desired render do not reliably prune keys previously owned by
# helmfile's bootstrap release.
extraConfig:
  enable-gateway-api: "false"
  enable-gateway-api-secrets-sync: "false"

resources:
  requests:
    cpu: 100m
    memory: 320Mi

# NetworkPolicies are ENFORCED — violations are dropped, not just logged. Only endpoints
# selected by a CiliumNetworkPolicy become default-deny for the covered direction (today just
# the cloudflared policy); every other endpoint stays default-allow. Before merging, validate
# via Hubble that cloudflared's allow-list covers all its real flows (no unexpected
# hubble_drop_total) — enforcing an incomplete policy would blackhole the tunnel's ingress path.
policyAuditMode: false

operator:
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 160Mi
    # Ceiling only. The VPA owns the request (RequestsOnly).
    # Matches the VPA maxAllowed.
    limits:
      memory: 256Mi
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

# Traefik owns Gateway routing. No desired Cilium policy uses L7/DNS/FQDN
# enforcement or CiliumEnvoyConfig, so the chart's otherwise-default standalone
# Envoy DaemonSet has no consumer. Re-enable before adding any of those features.
envoy:
  enabled: false

# Expose cilium-agent metrics and register a ServiceMonitor so Prometheus
# scrapes them automatically.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

# TODO: enable cilium GAPI once it has support for ClusterIP type in CiliumGatewayClassConfig.
# ref: https://claude.ai/share/589a7ce8-eea1-4043-aaab-69d4d6ee9333
gatewayAPI:
  enabled: false
  # gatewayClass:
  #   create: "true"

# Use host's cgroup2 mount; avoids the duplicate /run/cilium/cgroupv2 mount
# and gives Hubble full host cgroup tree visibility.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Hubble Relay aggregates flows; UI exposes a web visualizer.
# certgen CronJob manages cilium-ca and hubble-server-certs (not Helm's genCA)
# for deterministic ArgoCD renders; rotates every 4 months, hot-reloaded.
hubble:
  relay:
    enabled: true
    # Ceiling only. The VPA owns the request (RequestsOnly).
    resources:
      limits:
        memory: 256Mi
  ui:
    enabled: true
    # Ceilings only. The VPA owns the requests (RequestsOnly).
    backend:
      resources:
        limits:
          memory: 256Mi
    frontend:
      resources:
        limits:
          memory: 256Mi
  tls:
    auto:
      method: cronJob
  metrics:
    # Drop visibility includes endpoint context so alerts identify the denied
    # path. Only dropped flows create these IP-labelled series. Flow uses
    # namespace-level context to keep its higher-volume cardinality manageable.
    enabled:
      - "drop:labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
      - tcp
      - "flow:sourceContext=namespace;destinationContext=namespace"
      - icmp
      - "dns:query;ignoreAAAA"
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
      namespace: monitoring
