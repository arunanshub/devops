configs:
  params:
    server.insecure: "true"
    # Traefik owns HTTP response compression on the steady-state external route.
    server.enable.gzip: "false"

controller:
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 2Gi
  # Export Application sync and health state to the existing VictoriaMetrics
  # and Alertmanager path.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      namespace: monitoring

server:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 1Gi
  # Prefer the application-controller's node. The controller polls the
  # repo-server with large gRPC responses. On 2026-08-03 a chart-update
  # rollout spread the three components across three nodes. The extra
  # cross-node bursts overflowed the WireGuard staged queue (128 packets)
  # and raised cilium_wg0 tx_dropped. Co-location keeps this traffic on
  # one node. Soft rule: scheduling never blocks if the node is full.
  # This replaces the chart's default anti-affinity preset, which only
  # separates replicas of the same component (a no-op at 1 replica).
  # See docs/2026-08-07-cilium-wireguard-tx-drops-research.md.
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: argocd-application-controller
            topologyKey: kubernetes.io/hostname

redis:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Same co-location rule as the repo-server (see comment above).
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: argocd-application-controller
            topologyKey: kubernetes.io/hostname

# Disabled: dex is unconfigured (no SSO/OIDC/connectors — logs "dex is not
# configured"). Auth is admin-only local login. Re-enable if SSO is added.
dex:
  enabled: false
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi

# Scaled to 0: no ApplicationSet CRs exist (app-of-apps uses plain Applications).
# Chart 9.5.21 has no applicationSet.enabled; replicas:0 is the off switch. Set
# back to 1 if ApplicationSets are ever introduced.
applicationSet:
  replicas: 0
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi

# Disabled: notifications are unconfigured (no triggers/services/subscriptions).
# Cluster alerting is VMRule/vmalertmanager-based, not ArgoCD notifications.
notifications:
  enabled: false
  resources:
    requests:
      cpu: 5m
      memory: 64Mi
    limits:
      memory: 128Mi
