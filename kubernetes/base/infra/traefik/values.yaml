ingressRoute:
  dashboard:
    enabled: true

providers:
  kubernetesGateway:
    enabled: true

gateway:
  listeners:
    web:
      namespacePolicy:
        from: All

service:
  spec:
    type: ClusterIP

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5

resources:
  requests:
    cpu: 10m
    memory: 32Mi # conservative floor, slightly above idle 23Mi
  limits:
    memory: 128Mi # cap; no CPU limit intentionally
