apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 9.5.6
    helm:
      valuesObject:
        configs:
          params:
            server.insecure: "true"
            # admin password is already set in the cluster from bootstrap
            # ArgoCD self-management does not re-set it
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - ServerSideApply=true # required for self-managing ArgoCD
    # no automated sync, no prune — deliberate for self-management
