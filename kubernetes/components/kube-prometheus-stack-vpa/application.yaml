apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack-vpa
  namespace: argocd
  annotations:
    # wave 2: kube-prometheus-stack (wave 1) must be running before VPA
    # targets it. selfHeal retries until the StatefulSet and CRDs exist.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: monitoring

  source:
    repoURL: git@github.com:arunanshub/devops.git
    targetRevision: master
    path: kubernetes/components/prometheus-vpa

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
