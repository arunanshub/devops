apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metrics-server
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  # Accepted risk: no memory limit. k3s ships metrics-server as a static
  # manifest, so no chart values or HelmChartConfig can set one. Measured
  # usage is 29Mi. A ceiling is not worth self-managing the addon.
  resourcePolicy:
    containerPolicies:
      - containerName: metrics-server
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 500m
          memory: 256Mi
