apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kured
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: kured
  updatePolicy:
    # InPlaceOrRecreate: measured usage (52Mi) sat above the chart request
    # (32Mi) with no actuation while Off. Every other VPA in this component
    # actuates; Off here was drift, not policy.
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: kured
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 5m
          memory: 10Mi
        maxAllowed:
          cpu: 100m
          memory: 128Mi
