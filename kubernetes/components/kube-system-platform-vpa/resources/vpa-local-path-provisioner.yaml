apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: local-path-provisioner
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  # Accepted risk: no memory limit. k3s ships local-path-provisioner as a
  # static manifest, so no chart values or HelmChartConfig can set one.
  # Measured usage is 14Mi. A ceiling is not worth self-managing the addon.
  resourcePolicy:
    containerPolicies:
      - containerName: local-path-provisioner
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 5m
          memory: 16Mi
        maxAllowed:
          cpu: 200m
          memory: 128Mi
