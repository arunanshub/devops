apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: velero
  namespace: velero
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: velero
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: velero
        # RequestsOnly: VPA manages only the request, never sets a limit. velero has no
        # declared memory limit on purpose (daily backup job — memory scales with backup
        # size, so it must not be capped). RequestsOnly guarantees VPA can't introduce one.
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 10m
          memory: 96Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
