apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cache-assets
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=31536000, immutable"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: traefik
spec:
  compress:
    encodings: [zstd, br, gzip]
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - image/svg+xml
      - application/octet-stream
