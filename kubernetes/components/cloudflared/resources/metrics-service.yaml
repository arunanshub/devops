apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  # part-of selects the QUIC pods and the http2 pods with one Service.
  # A Service selector cannot use matchExpressions.
  selector:
    app.kubernetes.io/part-of: cloudflared
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics
      protocol: TCP
