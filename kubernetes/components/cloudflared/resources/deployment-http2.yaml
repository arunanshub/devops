# Transport-diversity replica group. This Deployment runs the SAME tunnel as
# deployment.yaml but pins the http2 (TCP) transport. The QUIC group and this
# group register as replicas of one tunnel; Cloudflare distributes requests
# across all connected replicas.
# Reason: a path event (for example the 2026-08-13 HEL colo maintenance)
# makes QUIC tear down and re-register for ~20s, which serves 520s. TCP
# stalls through a brief loss window and resumes without a teardown. This
# group keeps the tunnel serving while the QUIC group re-registers.
# The transport was proven here before: the repo pinned http2 from 2026-07-16
# to 2026-08-08. Evidence: docs/cloudflare-tunnel-transport.md
# Protocol values: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters/#protocol
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-http2
  namespace: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared-http2
  replicas: 1
  template:
    metadata:
      labels:
        app: cloudflared-http2
        app.kubernetes.io/part-of: cloudflared
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --output
            - json
            - --protocol
            - http2
            - run
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
            - name: TUNNEL_GRACE_PERIOD
              value: 50s
          # Same probe rationale as deployment.yaml: cloudflared exits cleanly
          # when it cannot hold connections, so no liveness probe is needed.
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
            limits:
              # matches VPA maxAllowed (vpa-http2.yaml)
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
