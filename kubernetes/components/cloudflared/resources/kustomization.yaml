apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - metrics-service.yaml
  - servicemonitor.yaml
  - vpa.yaml
  - pdb.yaml
  - tunnel-token.sealedsecret.yaml

images:
  - name: cloudflare/cloudflared
    # Do not use 2026.8.0: the .0 release strips trailing slashes on HTTP
    # origins and causes redirect loops (cloudflared issue #1717). 2026.8.1
    # fixed it and 2026.8.2 keeps the fix. digest = the index (manifest list).
    newTag: "2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d"
