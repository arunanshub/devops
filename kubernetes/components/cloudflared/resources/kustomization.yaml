apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - metrics-service.yaml
  - servicemonitor.yaml
  - vpa.yaml
  - pdb.yaml
  - sealed-tunnel-token.yaml

images:
  - name: cloudflare/cloudflared
    # Do not use 2026.8.0: the .0 release strips trailing slashes on HTTP
    # origins and causes redirect loops (cloudflared issue #1717). 2026.8.1
    # fixed it and 2026.8.2 keeps the fix. digest = the index (manifest list).
    newTag: 2026.8.2
    digest: sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
