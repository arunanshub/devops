apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - metrics-service.yaml
  - servicemonitor.yaml
  - vpa.yaml
  - pdb.yaml
  - sealed-tunnel-token.yaml

images:
