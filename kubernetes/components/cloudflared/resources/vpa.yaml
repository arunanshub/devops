apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudflared
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: cloudflared
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 5m
          memory: 20Mi
        maxAllowed:
          # 400m: sole conduit for all (uncached) dynamic traffic — cheap headroom
          # against throttling under a spike.
          cpu: 400m
          memory: 128Mi
