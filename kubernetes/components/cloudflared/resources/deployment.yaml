apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      # cloudflared drains for TUNNEL_GRACE_PERIOD (50s) after SIGTERM. This
      # value must stay above that period. Kubernetes sends SIGKILL at the end
      # of this period. The default is 30s and it stops the drain early.
      # No securityContext.sysctls block. net.ipv4.ping_group_range only serves
      # the ICMP proxy. This tunnel carries HTTP to Traefik and never ICMP.
      terminationGracePeriodSeconds: 60
      # One connector per node limits a node failure to one connector.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            # Structured logs so connection churn / edge-location changes / retry storms
            # are queryable in Loki without regex (metrics are already scraped). Verified
            # flag exists on this version (--output, env TUNNEL_LOG_OUTPUT).
            - --output
            - json
            # No --protocol flag. cloudflared then uses `auto`. `auto` selects
            # QUIC and falls back to http2 when UDP fails.
            # Do not pin http2. Both transports fail the same way. QUIC lost
            # every connection on 2026-08-17. http2 lost every connection on
            # 2026-08-21. The transport does not prevent an edge event.
            # http2 also blocks post-quantum key agreement.
            # See docs/cloudflare-tunnel-transport.md.
            - run
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
            # cloudflared stops accepting requests on SIGTERM and waits this
            # long for in-progress requests. The default is 30s.
            - name: TUNNEL_GRACE_PERIOD
              value: 50s
          # cloudflared exits cleanly (code 0) when it cannot maintain tunnel
          # connections, so no liveness probe is needed — Kubernetes restarts
          # it automatically. /ready returns 503 until connections are up;
          # failureThreshold:6 gives 60s for the tunnel to establish before
          # the pod is marked unready and pulled from the Service endpoints.
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
            limits:
              # matches VPA maxAllowed (platform-misc-vpa) so a scaled-out/replaced
              # pod can't OOM before VPA in-place resizes it
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # cloudflared writes nothing to disk in token mode, but give it a
          # writable /tmp so a read-only rootfs can't surprise us on upgrade.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
