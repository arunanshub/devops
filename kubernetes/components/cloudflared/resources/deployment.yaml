apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      # Prefer spreading across nodes so a single node failure doesn't drop both
      # tunnel connections, but allow co-location rather than block scheduling.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            # Structured logs so connection churn / edge-location changes / retry storms
            # are queryable in Loki without regex (metrics are already scraped). Verified
            # flag exists on this version (--output, env TUNNEL_LOG_OUTPUT).
            - --output
            - json
            # TEMPORARY EXPERIMENT (2026-07-16): isolate the Cloudflare
            # edge-to-connector leg after synchronized QUIC "no recent network
            # activity" timeouts, long asset stalls, and a 520 before origin.
            # Browser-facing HTTP/3 is unchanged. Evidence, attribution, and
            # rollback: docs/cloudflare-tunnel-transport.md
            # Cloudflare: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters/#protocol
            # Related upstream report: https://github.com/cloudflare/cloudflared/issues/895
            # - --protocol
            # - http2
            - run
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
            - name: TUNNEL_GRACE_PERIOD
              value: 50s
          # cloudflared exits cleanly (code 0) when it cannot maintain tunnel
          # connections, so no liveness probe is needed — Kubernetes restarts
          # it automatically. /ready returns 503 until connections are up;
          # failureThreshold:6 gives 60s for the tunnel to establish before
          # the pod is marked unready and pulled from the Service endpoints.
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
            limits:
              # matches VPA maxAllowed (platform-misc-vpa) so a scaled-out/replaced
              # pod can't OOM before VPA in-place resizes it
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # cloudflared writes nothing to disk in token mode, but give it a
          # writable /tmp so a read-only rootfs can't surprise us on upgrade.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
