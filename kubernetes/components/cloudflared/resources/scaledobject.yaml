apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudflared
  minReplicaCount: 2
  maxReplicaCount: 4
  pollingInterval: 30
  cooldownPeriod: 60
  fallback:
    failureThreshold: 3
    replicas: 2
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: traefik_requests_per_second
        query: sum(rate(traefik_service_requests_total[2m]))
        threshold: "100"
