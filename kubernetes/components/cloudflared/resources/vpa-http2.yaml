apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cloudflared-http2
  namespace: cloudflared
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudflared-http2
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: cloudflared
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 5m
          memory: 20Mi
        maxAllowed:
          # Same ceilings as the QUIC group (vpa.yaml). The http2 replica
          # carries the same traffic when the QUIC connections are down.
          cpu: 400m
          memory: 128Mi
