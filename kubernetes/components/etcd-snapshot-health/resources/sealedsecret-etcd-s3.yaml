apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: k3s-etcd-snapshot-s3-config
  namespace: kube-system
spec:
  encryptedData:
    etcd-s3-access-key: 
    etcd-s3-bucket: 
    etcd-s3-bucket-lookup-type: 
    etcd-s3-endpoint: 
    etcd-s3-folder: 
    etcd-s3-insecure: 
    etcd-s3-region: 
    etcd-s3-secret-key: 
    etcd-s3-timeout: 
  template:
    metadata:
      name: k3s-etcd-snapshot-s3-config
      namespace: kube-system
    type: etcd.k3s.cattle.io/s3-config-secret
