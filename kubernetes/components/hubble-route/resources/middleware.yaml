apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: kube-system
spec:
  compress:
    # Traefik uses only an encoding that the client advertises. The order sets
    # the priority. Cloudflare sends `Accept-Encoding: br, gzip` today, so
    # brotli wins and zstd stays inert. zstd leads the list for the day
    # Cloudflare adds it.
    encodings: [zstd, br, gzip]
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - image/svg+xml
      - application/octet-stream # hubble's stream can be massive (400kB+)
