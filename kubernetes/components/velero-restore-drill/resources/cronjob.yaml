apiVersion: batch/v1
kind: CronJob
metadata:
  name: velero-restore-drill
  namespace: velero
spec:
  schedule: "0 8 1 * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: velero-restore-drill
          automountServiceAccountToken: true
          containers:
            - name: drill
              image: alpine/k8s
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  RESTORE_NAME="drill-$(date +%Y%m%d%H%M%S)"
                  TEST_NS="velero-restore-test"

                  cleanup() {
                    kubectl delete namespace "$TEST_NS" --ignore-not-found --wait=false || true
                    kubectl delete restore "$RESTORE_NAME" -n velero --ignore-not-found || true
                  }

                  fail() {
                    echo "ERROR: $*"
                    kubectl get restore "$RESTORE_NAME" -n velero -o yaml || true
                    kubectl describe restore "$RESTORE_NAME" -n velero || true
                    cleanup
                    exit 1
                  }

                  # Find latest completed daily-full backup (name sorting = time sorting for velero schedule names)
                  LATEST=$(kubectl get backup -n velero \
                    -l velero.io/schedule-name=daily-full \
                    -o jsonpath='{range .items[*]}{.status.phase}{"|"}{.metadata.name}{"\n"}{end}' | \
                    awk -F'|' '$1 == "Completed" {print $2}' | sort | tail -1 || true)

                  if [ -z "$LATEST" ]; then
                    echo "ERROR: no completed daily-full backup found"
                    exit 1
                  fi
                  echo "Using backup: $LATEST"

                  # Idempotent cleanup. The restore must not start until the old
                  # namespace is fully gone, otherwise generated resources can
                  # collide and produce false-positive warnings.
                  kubectl delete namespace "$TEST_NS" --ignore-not-found --wait=false
                  i=0
                  while kubectl get namespace "$TEST_NS" >/dev/null 2>&1; do
                    if [ "$i" -ge 60 ]; then
                      fail "namespace $TEST_NS is still terminating after 10 minutes"
                    fi
                    echo "Waiting for old namespace $TEST_NS to terminate"
                    sleep 10
                    i=$((i + 1))
                  done

                  # Create Restore CR
                  cat <<EOF | kubectl apply -f -
                  apiVersion: velero.io/v1
                  kind: Restore
                  metadata:
                    name: $RESTORE_NAME
                    namespace: velero
                  spec:
                    backupName: $LATEST
                    includedNamespaces:
                      - monitoring
                    includeClusterResources: false
                    existingResourcePolicy: update
                    excludedResources:
                      - ciliumendpoints.cilium.io
                      - controllerrevisions.apps
                      - endpoints
                      - endpointslices.discovery.k8s.io
                      - events
                      - events.events.k8s.io
                      - pods
                      - replicasets.apps
                      - verticalpodautoscalercheckpoints.autoscaling.k8s.io
                    namespaceMapping:
                      monitoring: velero-restore-test
                  EOF

                  # Poll until terminal phase (up to 15 minutes)
                  i=0
                  while [ $i -lt 30 ]; do
                    PHASE=$(kubectl get restore "$RESTORE_NAME" -n velero \
                      -o jsonpath='{.status.phase}' 2>/dev/null || echo "New")
                    echo "Phase: $PHASE"
                    case "$PHASE" in
                      Completed|Failed|PartiallyFailed) break ;;
                    esac
                    sleep 30
                    i=$((i + 1))
                  done

                  # Check result BEFORE cleanup so cleanup failures don't mask it
                  if [ "$PHASE" != "Completed" ]; then
                    fail "restore phase was '$PHASE', expected 'Completed'"
                  fi

                  WARNINGS=$(kubectl get restore "$RESTORE_NAME" -n velero \
                    -o jsonpath='{.status.warnings}' 2>/dev/null || true)
                  ERRORS=$(kubectl get restore "$RESTORE_NAME" -n velero \
                    -o jsonpath='{.status.errors}' 2>/dev/null || true)
                  WARNINGS=${WARNINGS:-0}
                  ERRORS=${ERRORS:-0}
                  if [ "$WARNINGS" != "0" ] || [ "$ERRORS" != "0" ]; then
                    fail "restore completed with warnings=$WARNINGS errors=$ERRORS"
                  fi

                  TOTAL_ITEMS=$(kubectl get restore "$RESTORE_NAME" -n velero \
                    -o jsonpath='{.status.progress.totalItems}' 2>/dev/null || true)
                  RESTORED_ITEMS=$(kubectl get restore "$RESTORE_NAME" -n velero \
                    -o jsonpath='{.status.progress.itemsRestored}' 2>/dev/null || true)
                  if [ -n "$TOTAL_ITEMS" ] && [ "$TOTAL_ITEMS" != "0" ] && [ "$RESTORED_ITEMS" != "$TOTAL_ITEMS" ]; then
                    fail "restore reported $RESTORED_ITEMS/$TOTAL_ITEMS items restored"
                  fi

                  # Cleanup — --wait=false avoids hanging on slow PVC/finalizer teardown
                  cleanup
                  echo "Restore drill succeeded"
