apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik
  namespace: traefik
spec:
  # Egress-only: Traefik parses hostile input from the internet, so this
  # bounds a compromise to the namespaces the Gateway already routes to.
  # No world egress; DNS exfil through CoreDNS remains an accepted gap.
  # No ingress section — the backends carry no policies, so gating port
  # 8000 adds nothing an in-cluster attacker cannot bypass, and Cilium
  # default-deny is per direction, so ingress stays open.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-traefik
  egress:
    # Kubernetes API — required by the Gateway/CRD providers. Cilium's service
    # load balancing redirects the Service VIP to API backends, so match the
    # kube-apiserver identity rather than the private load-balancer IP.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Gateway backends, Traefik's api@internal dashboard, DNS (kube-system),
    # and Tempo tracing (monitoring). This exactly mirrors the namespaces
    # admitted by the Gateway listener; no world or other namespace egress is
    # needed for the current direct-pod backend model.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arunanshu-dev
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: headlamp
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
