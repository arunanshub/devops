apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  endpointSelector:
    matchLabels:
      app: cloudflared
  ingress:
    # Kubelet readiness probe — observed: host:* -> cloudflared:2000 TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "2000"
              protocol: TCP
    # Prometheus scrape — observed: monitoring/prometheus:* -> cloudflared:2000 TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "2000"
              protocol: TCP
  egress:
    # CoreDNS — required for traefik.traefik.svc.cluster.local and edge DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Cloudflare edge — port 7844 carries BOTH the QUIC (UDP) primary and the
    # http2 (TCP) fallback; cloudflared runs default auto-protocol (no --protocol
    # flag), so it falls back to http2/TCP:7844 when QUIC is unavailable — and QUIC
    # over UDP is MTU-sensitive on this WireGuard+VXLAN overlay (path MTU 1305).
    # Omitting TCP:7844 would blackhole that fallback under enforcement.
    # 443/TCP is OPTIONAL per Cloudflare's tunnel firewall doc (update checks,
    # Access-JWT validation, PQ error reporting); kept though --no-autoupdate is set.
    # https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/tunnel-with-firewall/
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "7844"
              protocol: UDP
            - port: "7844"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Traefik reverse proxy — observed: cloudflared:* -> traefik pod:8000 TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
