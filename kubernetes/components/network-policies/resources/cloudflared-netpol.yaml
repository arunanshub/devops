apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  # Egress-only: cloudflared holds the tunnel token, so its egress is locked
  # down. No ingress section — Cilium default-deny is per direction, so
  # ingress stays open and probes/scrapes need no carve-outs.
  # Covers both Deployments (app: cloudflared, app: cloudflared-http2).
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - cloudflared
          - cloudflared-http2
  egress:
    # CoreDNS — required for traefik.traefik.svc.cluster.local and edge DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Tunnel data plane. Port 7844 carries QUIC (UDP) and http2 (TCP).
    # toCIDRSet, not toFQDNs: cloudflared dials cached edge IPs directly,
    # and CIDRs need no DNS proxy. These are the global regions
    # (region1/region2); if cloudflared ever logs a us-region/fed edge, add
    # those ranges from the doc below.
    # https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/tunnel-with-firewall/
    #
    # No world:443 rule. The doc above marks api.cloudflare.com as optional
    # for token-run tunnels, and it would let a compromised pod exfiltrate
    # the token. If a future version fails registration at cold start,
    # re-add 443/TCP to world and record the version here.
    - toCIDRSet:
        - cidr: 198.41.192.0/24 # region1.v2.argotunnel.com
        - cidr: 198.41.200.0/24 # region2.v2.argotunnel.com
        - cidr: "2606:4700:a0::/48" # region1 (IPv6)
        - cidr: "2606:4700:a8::/48" # region2 (IPv6)
      toPorts:
        - ports:
            - port: "7844"
              protocol: UDP
            - port: "7844"
              protocol: TCP
    # Traefik reverse proxy — observed: cloudflared:* -> traefik pod:8000 TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
