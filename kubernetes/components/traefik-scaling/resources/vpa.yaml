apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: traefik
  namespace: traefik
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traefik
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: traefik
        # RequestsOnly: VPA manages the request only and leaves the limit at the
        # chart-declared value, so ratio preservation can no longer inflate the limit.
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 1
          memory: 512Mi
