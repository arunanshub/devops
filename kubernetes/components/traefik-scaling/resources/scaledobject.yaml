apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: traefik
  namespace: traefik
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traefik
  minReplicaCount: 2
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 60
  fallback:
    failureThreshold: 3
    replicas: 2
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
        metricName: traefik_requests_per_second
        query: sum(rate(traefik_service_requests_total[2m]))
        threshold: "50"
