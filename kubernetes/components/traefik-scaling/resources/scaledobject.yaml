apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: traefik
  namespace: traefik
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traefik
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: traefik_requests_per_second
        query: sum(rate(traefik_service_requests_total[2m]))
        threshold: "50"
