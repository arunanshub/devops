controller:
  hcloudToken:
    existingSecret:
      name: hcloud
      key: token
  resources:
    csiAttacher:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 128Mi
    csiResizer:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 128Mi
    csiProvisioner:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    livenessProbe:
      requests:
        cpu: 5m
        memory: 24Mi
      limits:
        memory: 64Mi
    hcloudCSIDriver:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

node:
  resources:
    csiNodeDriverRegistrar:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
    livenessProbe:
      requests:
        cpu: 5m
        memory: 24Mi
      limits:
        memory: 64Mi
    hcloudCSIDriver:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# Not setting as default to avoid conflict with k3s's local-path default.
# Always specify storageClassName: hcloud-volumes explicitly in PVC specs.
storageClasses:
  - name: hcloud-volumes
    defaultStorageClass: false
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
  - name: hcloud-volumes-encrypted
    defaultStorageClass: false
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    extraParameters:
      csi.storage.k8s.io/node-publish-secret-name: hcloud-luks-key
      csi.storage.k8s.io/node-publish-secret-namespace: kube-system

metrics:
  serviceMonitor:
    enabled: true
    # Dead-for-selection (VMAgent selectAllByDefault) but kept: removing it makes
    # the chart render labels: null and churns the ArgoCD diff. Not worth it.
    labels:
      release: kube-prometheus-stack

priorityClassName: system-cluster-critical
