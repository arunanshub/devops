apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vmagent
  namespace: monitoring
spec:
  # VPA must target the topmost scalable controller. The VMAgent CRD has a
  # scale subresource, so VPA refuses the operator-rendered Deployment
  # (ConfigUnsupported) and accepts only the CR. The CR needs shardCount
  # set for the scale path to resolve — see values.yaml. The vmalert and
  # vmsingle VPAs can target Deployments because those CRDs have no scale
  # subresource.
  targetRef:
    apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMAgent
    name: victoria-metrics-k8s-stack
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      # vmagent measured at 185Mi against a 96Mi chart request. Scrapes
      # were under-counted by 1.9x. maxAllowed matches the chart limit.
      - containerName: vmagent
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 50m
          memory: 96Mi
        maxAllowed:
          cpu: 500m
          memory: 384Mi
      - containerName: config-reloader
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 10m
          memory: 25Mi
        maxAllowed:
          cpu: 50m
          memory: 64Mi
