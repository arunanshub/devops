apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vmalert
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vmalert-victoria-metrics-k8s-stack
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: vmalert
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 200m
          memory: 512Mi
      - containerName: config-reloader
        minAllowed:
          cpu: 10m
          memory: 25Mi
        maxAllowed:
          cpu: 50m
          memory: 64Mi
