apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tempo
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: tempo
  updatePolicy:
    # Initial, not InPlaceOrRecreate: single-replica StatefulSet on an RWO PVC.
    # In-place memory decrease is kernel-rejected, so InPlaceOrRecreate falls
    # back to eviction → PVC detach/reattach gap. Initial applies recommendations
    # only at pod creation, avoiding mid-life evictions.
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: tempo
        minAllowed:
          cpu: 10m
          memory: 192Mi
        maxAllowed:
          cpu: 1
          memory: 1Gi
