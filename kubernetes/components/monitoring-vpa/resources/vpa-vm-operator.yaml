apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vm-operator
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: victoria-metrics-k8s-stack-victoria-metrics-operator
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: operator
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 200m
          memory: 256Mi
