apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: victoria-metrics-k8s-stack-kube-state-metrics
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: kube-state-metrics
        # RequestsOnly: pins the 512Mi limit declared in the chart values so ratio
        # preservation cannot inflate it. maxAllowed below equals that limit, so the
        # request can never exceed it.
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 10m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
