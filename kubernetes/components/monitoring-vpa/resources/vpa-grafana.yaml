apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: grafana
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: victoria-metrics-k8s-stack-grafana
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: grafana
        minAllowed:
          cpu: 25m
          memory: 256Mi
        maxAllowed:
          cpu: 500m
          memory: 1Gi
