apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vmsingle-victoria-metrics-k8s-stack
  updatePolicy:
    # Initial, not InPlaceOrRecreate: this is a single-replica Deployment on an
    # RWO PVC. In-place memory *decrease* is rejected by the kernel cgroup, so
    # InPlaceOrRecreate falls back to eviction → PVC detach/reattach gap. Initial
    # applies recommendations only at pod creation, avoiding mid-life evictions.
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: vmsingle
        # RequestsOnly: VPA manages the request only, leaving the limit fixed at the
        # chart-declared value so ratio preservation can't inflate it. maxAllowed raised
        # to 3Gi because the previous 2560Mi cap was below the measured 2922Mi peak.
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 100m
          memory: 512Mi
        maxAllowed:
          cpu: 2000m
          memory: 3Gi
