apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vmsingle-victoria-metrics-k8s-stack
  updatePolicy:
    # Initial, not InPlaceOrRecreate: this is a single-replica Deployment on an
    # RWO PVC. In-place memory *decrease* is rejected by the kernel cgroup, so
    # InPlaceOrRecreate falls back to eviction → PVC detach/reattach gap. Initial
    # applies recommendations only at pod creation, avoiding mid-life evictions.
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: vmsingle
        minAllowed:
          cpu: 100m
          memory: 512Mi
        maxAllowed:
          cpu: 2000m
          memory: 2560Mi
