apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra

  source:
    repoURL: https://github.com/rancher/system-upgrade-controller
    # Pinned to the commit SHA for v0.19.2 — git tags are mutable references;
    # using the SHA prevents silent drift if the upstream tag is force-pushed.
    targetRevision: 38f3e11fd1dd19872f97565f8a75c39acc85d82b
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
