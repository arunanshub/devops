apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra

  source:
    repoURL: https://github.com/rancher/system-upgrade-controller
    # Pinned to the commit SHA for v0.19.2 — git tags are mutable references;
    # using the SHA prevents silent drift if the upstream tag is force-pushed.
    targetRevision: 38f3e11fd1dd19872f97565f8a75c39acc85d82b
    path: .
    kustomize:
      # The upstream Deployment declares no resources. The controller was
      # BestEffort: the first eviction candidate on the node. Give it a
      # floor and a ceiling. If upstream adds resources, this JSON patch
      # fails the sync on purpose. Re-review then.
      patches:
        - target:
            kind: Deployment
            name: system-upgrade-controller
          patch: |-
            - op: add
              path: /spec/template/spec/containers/0/resources
              value:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
