apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cilium-envoy
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: cilium-envoy
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: cilium-envoy
        minAllowed:
          cpu: 10m
          memory: 24Mi
        maxAllowed:
          cpu: 1
          memory: 256Mi
