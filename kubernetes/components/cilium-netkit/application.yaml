apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-netkit
  namespace: argocd
  annotations:
    # The CiliumNodeConfig CRD comes from the Cilium chart (wave 1).
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra

  source:
    repoURL: git@github.com:arunanshub/devops.git
    targetRevision: master
    path: kubernetes/components/cilium-netkit/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
