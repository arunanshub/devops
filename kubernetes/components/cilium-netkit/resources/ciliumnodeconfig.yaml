# Per-node migration from veth to netkit (Layer 3 mode).
#
# Cilium cannot switch an existing node in place. veth and netkit pods cannot
# run together on one node. Migrate one node at a time:
#
# 1. Cordon and drain the node.
# 2. Add the label `cilium.io/datapath=netkit` to the node.
# 3. Reboot the node. The reboot removes the old veth pods, also the DaemonSet
#    pods on the pod network. The agent then starts in netkit mode.
# 4. Check that `cilium-dbg status` shows `Device Mode: netkit`, then uncordon.
#
# A node without the label keeps the cilium-config value (veth).
# After all nodes migrate, set bpf.datapathMode in both Cilium values files and
# remove this object.
#
# The agent reads this object only at start.
# Source: https://docs.cilium.io/en/stable/configuration/per-node-config/
# Source: https://docs.cilium.io/en/stable/operations/performance/tuning/#netkit-device-mode
apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: netkit
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      cilium.io/datapath: netkit
  defaults:
    datapath-mode: netkit
