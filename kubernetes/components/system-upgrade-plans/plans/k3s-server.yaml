apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  # Track the stable channel. SUC polls this URL. A newer resolved version
  # starts a rolling upgrade Job (concurrency 1, cordon per node).
  #
  # History: on 2026-06-26 the upstream endpoint had a bug. It answered
  # v1.36.2 or v1.35.5 at random. Each flap below the running version made
  # SUC create a downgrade Job. The k3s-upgrade downgrade guard failed the
  # Job, and cp-3 stayed cordoned (NodeCordonedTooLong). The pin that
  # followed is removed: the endpoint answers consistently since.
  #
  # If the flap returns: remove `channel` and pin `version: <current>`.
  # The NodeCordonedTooLong alert is the early warning.
  # Keep infra/locals.tf k3s_version at or below the channel version.
  channel: https://update.k3s.io/v1-release/channels/stable
  concurrency: 1
  cordon: true
  serviceAccountName: system-upgrade
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  upgrade:
    # SUC appends the resolved k3s version as the image tag at Job creation time
    # (e.g. rancher/k3s-upgrade:v1.32.3-k3s1). This is not a bare :latest pull.
    image: rancher/k3s-upgrade
