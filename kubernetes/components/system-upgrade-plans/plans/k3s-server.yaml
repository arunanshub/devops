apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  # Track the stable channel. SUC polls this URL; when it resolves to a newer
  # version than what's running on the node, an upgrade Job is created.
  # To pin explicitly instead: remove `channel` and set `version: v1.32.3+k3s1`
  channel: https://update.k3s.io/v1-release/channels/stable
  concurrency: 1
  cordon: true
  serviceAccountName: system-upgrade
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  upgrade:
    # SUC appends the resolved k3s version as the image tag at Job creation time
    # (e.g. rancher/k3s-upgrade:v1.32.3-k3s1). This is not a bare :latest pull.
    image: rancher/k3s-upgrade
