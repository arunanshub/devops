apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  # Pinned explicitly (was: channel: .../stable). The k3s stable channel
  # flapped below the running version — it served v1.35.5 while the cluster
  # ran v1.36.2 — so SUC kept creating downgrade Jobs that the k3s-upgrade
  # downgrade-guard fails, leaving cp-3 cordoned (NodeCordonedTooLong,
  # 2026-06-26). Pinning makes the target deterministic and immune to flap.
  # Bump this in lockstep with infra/locals.tf k3s_version when upgrading.
  # To track a channel again: remove `version` and set `channel: <url>`.
  version: v1.36.2+k3s1
  concurrency: 1
  cordon: true
  serviceAccountName: system-upgrade
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  upgrade:
    # SUC appends the resolved k3s version as the image tag at Job creation time
    # (e.g. rancher/k3s-upgrade:v1.32.3-k3s1). This is not a bare :latest pull.
    image: rancher/k3s-upgrade
