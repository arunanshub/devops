# Must render to the same manifests as kubernetes/bootstrap/values/cilium.yaml.gotmpl
# at bootstrap time, otherwise ArgoCD's first reconcile under ServerSideApply
# will mutate Cilium resources.

kubeProxyReplacement: true

# Private IP of cp-1 from infra/locals.tf (control_plane_ip).
# Migrate to the Hetzner LB IP when adding a second control plane.
k8sServiceHost: 10.0.0.2
k8sServicePort: 6443

ipam:
  mode: kubernetes

routingMode: native
ipv4NativeRoutingCIDR: 10.42.0.0/16
autoDirectNodeRoutes: false
endpointRoutes:
  enabled: true

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

operator:
  replicas: 1

gatewayAPI:
  enabled: true

# Use host's cgroup2 mount; avoids the duplicate /run/cilium/cgroupv2 mount
# and gives Hubble full host cgroup tree visibility.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Hubble Relay aggregates flows; UI exposes a web visualizer.
# certgen CronJob manages cilium-ca and hubble-server-certs (not Helm's genCA)
# for deterministic ArgoCD renders; rotates every 4 months, hot-reloaded.
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  tls:
    auto:
      method: cronJob
