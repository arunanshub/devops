# Must render to the same manifests as kubernetes/bootstrap/values/cilium.yaml.gotmpl
# at bootstrap time, otherwise ArgoCD's first reconcile under ServerSideApply
# will mutate Cilium resources.

kubeProxyReplacement: true

# Private IP of cp-1 from infra/locals.tf (control_plane_ip).
# Migrate to the Hetzner LB IP when adding a second control plane.
k8sServiceHost: 10.0.0.2
k8sServicePort: 6443

ipam:
  mode: kubernetes

routingMode: native
ipv4NativeRoutingCIDR: 10.42.0.0/16
autoDirectNodeRoutes: false
endpointRoutes:
  enabled: true

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

operator:
  replicas: 1

gatewayAPI:
  enabled: true
