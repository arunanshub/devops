[defaults]
interpreter_python = auto_silent
retry_files_enabled = False
# Paths relative to repo root (where ansible.cfg lives and ansible-playbook runs from).
roles_path = ansible/roles
collections_path = ansible/collections
# Nodes are ephemeral — fingerprints change on every rebuild. Strict checking
# just means manually clearing infra/.ssh_known_hosts after every apply.
host_key_checking = False
