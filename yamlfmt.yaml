formatter:
  retain_line_breaks_single: true
  retain_line_breaks: true

include:
  - "**/*.yaml"
  - "**/*.yml"

exclude:
  - "**/*.{secrets,sops}.{yml,yaml}"
  - "**/{secrets,sops}.{yml,yaml}"
  # Helm templates are Go templates, not YAML.
  - "kubernetes/bootstrap/raw/templates/**"

match_type: doublestar
