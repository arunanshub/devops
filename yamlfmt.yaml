formatter:
  retain_line_breaks_single: true
  retain_line_breaks: true

include:
  - "**/*.yaml"
  - "**/*.yml"

exclude:
  - "**/*.{secrets,sops}.{yml,yaml}"
  - "**/{secrets,sops}.{yml,yaml}"
  # yamlfmt reformats inline flow mappings in ways that conflict with
  # ansible-lint's yaml[commas] rule (trailing comma in `{k: v},}` pattern).
  - "ansible/playbooks/ops/migrate-prometheus-encrypted.yml"

match_type: doublestar
