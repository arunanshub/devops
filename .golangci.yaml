version: "2"

run:
  tests: true

linters:
  default: none

  enable:
    # Baseline correctness.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Resource lifecycle.
    - bodyclose
    - sqlclosecheck
    - rowserrcheck

    # Error and context correctness.
    - errorlint
    - nilerr
    - contextcheck
    - noctx

    # Silent footguns.
    - asasalint
    - bidichk
    - durationcheck
    - makezero
    - reassign
    - fatcontext
    - containedctx

    # Security.
    - gosec

    # Mechanical correctness and cleanup.
    - unconvert
    - wastedassign
    - copyloopvar
    - gocritic

    # Deliberate project policy.
    - nilnil
    - forcetypeassert
    - exhaustive

    # Agent containment.
    - nolintlint
    # - depguard
    # - forbidigo
    - loggercheck

    # code quality
    - gocognit
    # - nestif
    # - funlen
    - cyclop
    - maintidx

    # Custom.
    - nilaway

  settings:
    custom:
      nilaway:
        type: module
        description: Static analysis tool to detect potential nil panics in Go code.
        settings:
          include-pkgs: "github.com/arunanshub/devops"
          exclude-pkgs: ""

    maintidx:
      under: 40
    gocognit:
      min-complexity: 20
    cyclop:
      max-complexity: 15
      package-average: 0

    # nestif:
    #   min-complexity: 5
    # funlen:
    #   lines: -1
    #   statements: 60
    #   ignore-comments: true

    errcheck:
      check-type-assertions: true
      check-blank: true

    gosec:
      excludes:
        - G104

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
      settings:
        rangeValCopy:
          sizeThreshold: 512

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling

    rules:
      - path: _test\.go
        linters:
          - gosec
          - contextcheck
          - maintidx

formatters:
  enable:
    - gofumpt
    - gci

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/arunanshub/devops)
