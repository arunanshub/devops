version: "2"

run:
  tests: true

linters:
  default: none

  enable:
    # Baseline correctness.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Resource lifecycle.
    - bodyclose
    - sqlclosecheck
    - rowserrcheck

    # Error and context correctness.
    - errorlint
    - nilerr
    - nilnesserr
    - contextcheck
    - noctx

    # Silent footguns.
    - asasalint
    - bidichk
    - durationcheck
    - makezero
    - reassign
    - fatcontext
    - containedctx
    - musttag

    # API and protobuf correctness.
    - protogetter
    - canonicalheader
    - nosprintfhostport

    # Security.
    - gosec

    # Mechanical correctness and cleanup.
    - unconvert
    - wastedassign
    - copyloopvar
    - gocritic
    - modernize
    - intrange
    - exptostd
    - usestdlibvars
    - godot
    - perfsprint
    - mirror
    - unparam
    - predeclared
    - errname
    - dupword
    - misspell
    - goconst
    - prealloc
    - gocheckcompilerdirectives
    - asciicheck

    # Layout and ordering.
    - whitespace
    - tagalign
    - funcorder
    - embeddedstructfieldcheck

    # Deliberate project policy.
    - nilnil
    - forcetypeassert
    - exhaustive

    # Agent containment.
    - nolintlint
    - loggercheck
    - sloglint

    # Test hygiene.
    - usetesting
    - thelper
    - tparallel
    - testifylint

    # Code quality.
    - gocognit
    - cyclop
    - maintidx
    - lll

    # Custom.
    - nilaway

  settings:
    custom:
      nilaway:
        type: module
        description: Static analysis tool to detect potential nil panics in Go code.
        settings:
          include-pkgs: "github.com/arunanshub/devops"
          exclude-pkgs: ""
          experimental-struct-init: "true"

    maintidx:
      under: 40
    gocognit:
      min-complexity: 20
    cyclop:
      max-complexity: 15
      package-average: 0

    # nestif:
    #   min-complexity: 5
    # funlen:
    #   lines: -1
    #   statements: 60
    #   ignore-comments: true

    errcheck:
      check-type-assertions: true
      check-blank: true

    gosec:
      excludes:
        - G104

    goconst:
      ignore-tests: true

    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
      settings:
        rangeValCopy:
          sizeThreshold: 512

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    sloglint:
      # One call style everywhere: slog.String(...) attrs, and the
      # *Context variants whenever a ctx is in scope.
      attr-only: true
      context: scope

    lll:
      line-length: 120

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling

    rules:
      - path: _test\.go
        linters:
          - gosec
          - contextcheck
          - maintidx

      # Struct-tag lines (kong CLI help text) cannot wrap.
      - linters:
          - lll
        source: "`.+`$"

formatters:
  enable:
    - gofumpt
    - gci
    - golines

  settings:
    golines:
      # Auto-wrap long lines to the lll limit. Measured to clear ~897 of the
      # lll hits repo-wide; the rest are struct tags, strings and comments it
      # cannot wrap, and those get wrapped or excluded by hand.
      max-len: 120
      # tagalign owns struct-tag alignment. Keep golines from undoing its fix.
      reformat-tags: false
    gci:
      sections:
        - standard
        - default
        - localmodule
