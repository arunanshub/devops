# Kernel tuning for a Kubernetes node.
# The Ansible baseline role manages this file. Do not edit it on the node.

# QUIC needs a large UDP socket buffer. quic-go asks for 7168 KiB. The kernel
# default of 212992 bytes gives only 416 KiB, and quic-go then prints
# "failed to sufficiently increase receive buffer size". The kernel drops each
# packet that arrives on a full queue. quic-go reads a drop as congestion and
# collapses the congestion window. cloudflared drops all capabilities, so it
# cannot raise the limit itself. A host value is the only lever.
# Source: https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# A Kubernetes node uses many inotify instances. Each container that watches a
# file takes one instance. The Ubuntu default of 128 instances is a desktop
# value. A node that runs out reports "too many open files".
# Source: https://kind.sigs.k8s.io/docs/user/known-issues/
fs.inotify.max_user_instances = 512
fs.inotify.max_user_watches = 524288
