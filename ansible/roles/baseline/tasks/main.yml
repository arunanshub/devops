- name: Install unattended-upgrades packages
  ansible.builtin.apt:
    name:
      - lsb-release
      - unattended-upgrades
      - cryptsetup
    state: present
    update_cache: true

- name: Configure unattended security upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
