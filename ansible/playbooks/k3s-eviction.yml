# Targeted one-shot playbook — do NOT import into site.yml.
# Restarts k3s on each node; running this on every baseline apply would be disruptive.
- name: Configure kubelet memory eviction thresholds
  hosts: k3s_nodes
  gather_facts: false
  become: false
  serial: 1
  max_fail_percentage: 0
  order: sorted
  tasks:
    - name: Set k3s service name
      ansible.builtin.set_fact:
        k3s_service_name: "{{ 'k3s' if node_role in ['cp_only', 'cp_worker'] else 'k3s-agent' }}"

    - name: Remove stale kubelet.conf.d drop-in
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/eviction.yaml
        state: absent

    - name: Create k3s config drop-in directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy eviction thresholds via k3s kubelet-arg
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/eviction.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          kubelet-arg+:
            - "eviction-hard=memory.available<500Mi,imagefs.available<5%,nodefs.available<5%"
            - "eviction-soft=memory.available<1Gi"
            - "eviction-soft-grace-period=memory.available=2m0s"
      register: eviction_config

    - name: Restart k3s to apply kubelet config
      ansible.builtin.systemd:
        name: "{{ k3s_service_name }}"
        state: restarted
      when: eviction_config.changed and not ansible_check_mode

    - name: Wait for node to be Ready
      ansible.builtin.command:
        cmd: kubectl get node {{ kubernetes_node_name }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: localhost
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 30
      delay: 10
      when: eviction_config.changed and not ansible_check_mode

    - name: Verify eviction thresholds in kubelet config
      ansible.builtin.shell:
        cmd: |
          kubectl get --raw /api/v1/nodes/{{ kubernetes_node_name }}/proxy/configz | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          hard = data['kubeletconfig']['evictionHard']
          soft = data['kubeletconfig'].get('evictionSoft', {})
          assert hard.get('memory.available') == '500Mi', f'evictionHard.memory.available not set: {hard}'
          assert 'imagefs.available' in hard, f'imagefs.available clobbered: {hard}'
          assert 'nodefs.available' in hard, f'nodefs.available clobbered: {hard}'
          assert soft.get('memory.available') == '1Gi', f'evictionSoft.memory.available not set: {soft}'
          print('evictionHard: ' + str(hard))
          print('evictionSoft: ' + str(soft))
          "
      delegate_to: localhost
      register: verify_result
      until: verify_result.rc == 0
      retries: 12
      delay: 5
      when: eviction_config.changed and not ansible_check_mode
