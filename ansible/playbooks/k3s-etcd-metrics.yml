# One-shot playbook — do NOT import into site.yml.
# Phase 2 node-config (gitops-sibling: see docs/2026-06-19-unused-optimization-levers.md):
# expose embedded-etcd metrics on :2381 so the in-cluster vmagent can scrape etcd health.
#
# NOTE: image-pull parallelism was DROPPED from Phase 2. k3s v1.35's embedded kubelet rejects
# --max-parallel-image-pulls as an unknown CLI flag (it is a KubeletConfiguration *file* field,
# not a kubelet command-line flag, unlike --serialize-image-pulls), which crash-looped k3s on
# 2026-06-19. Revisit via a kubelet config file as its own tested change if ever wanted.
#
# Restarts k3s on each control-plane node ONE AT A TIME (serial:1) → etcd quorum (2/3) preserved
# throughout. A k3s restart is NON-disruptive to running pods: it re-attaches to existing
# containers via containerd, it does not recreate them.
#
# The operator kubeconfig points at cp-1's API, so while cp-1 itself restarts the endpoint is
# briefly unreachable; the readiness wait tolerates that (default([]) keeps the until conditional
# from erroring on a failed query, so it retries instead of aborting).
#
# ORDER: confirm :2381 is exposed on every node BEFORE shipping the gitops follow-up (kubeEtcd
# scrape with endpoints 10.0.0.2/3/4:2381 + re-enabled etcd default rules). Enabling the scrape
# first would point a VMServiceScrape at a closed port → spurious down-target alert.
#
# Run:  just ansible-check    k3s-etcd-metrics   # dry-run (--check --diff), no changes
#       just ansible-converge k3s-etcd-metrics   # apply (rolling, one node at a time)
- name: Configure k3s etcd metrics exposure (Phase 2)
  hosts: control_planes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  order: sorted
  handlers:
    # The drop-in copy task notifies this; flush_handlers (below) forces it to run BEFORE the
    # wait/verify tasks under serial:1. A failed restart fails the host → with serial:1 that is
    # 100% > max_fail_percentage:0 → the play aborts before the next node, preserving etcd quorum.
    - name: Restart k3s
      ansible.builtin.systemd:
        name: "{{ k3s_service_name }}"
        state: restarted

  tasks:
    - name: Set k3s service name
      ansible.builtin.set_fact:
        k3s_service_name: k3s

    - name: Create k3s config drop-in directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy etcd-expose-metrics drop-in
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/etcd-expose-metrics.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          # Bind embedded-etcd metrics to a non-loopback :2381 (k3s default is 127.0.0.1 only) so
          # the in-cluster vmagent can reach them. :2381 is unauthenticated plain HTTP — acceptable
          # because it is reachable only on the Hetzner private network (10.0.0.x); the Hetzner
          # Cloud Firewall filters public NICs only and does not expose it to the internet.
          etcd-expose-metrics: true
      notify: Restart k3s

    # Force the Restart k3s handler to run now (before wait/verify) instead of at play end.
    - name: Flush handlers (restart k3s before verifying)
      ansible.builtin.meta: flush_handlers

    - name: Wait for this node to be Ready again
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ kubernetes_node_name }}"
      register: node_info
      delegate_to: localhost
      become: false
      # default([]) tolerates the API endpoint (cp-1) being briefly unreachable during its own
      # restart: a failed query → empty resources → until false → retry (not a templating error).
      until: >
        (node_info.resources | default([]) | length > 0) and (node_info.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready')
         | map(attribute='status') | list | first | default('')) == 'True'
      retries: 30
      delay: 10
      when: not ansible_check_mode

    - name: Verify etcd metrics now listen beyond loopback (etcd-expose-metrics took effect)
      # k3s binds :2381 to 127.0.0.1 by default and to a non-loopback address once exposed, so
      # "a :2381 listener on a non-loopback address exists" is the precise signal the flag landed.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -ltn | awk '$4 ~ /:2381$/' | grep -vqE '(127\.0\.0\.1|\[::1\]):2381'
        executable: /bin/bash
      register: etcd_listen_check
      changed_when: false
      until: etcd_listen_check.rc == 0
      retries: 12
      delay: 5
      when: not ansible_check_mode

    - name: Summary (per node)
      ansible.builtin.debug:
        msg: >-
          {{ kubernetes_node_name }}: etcd metrics exposed on :2381. After ALL nodes complete, ship gitops step 2b (kubeEtcd scrape) — see the levers doc.
      when: not ansible_check_mode
