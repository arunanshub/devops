# Recreate encrypted PVCs for Grafana, Alertmanager, and Tempo.
#
# Use this after rotating the LUKS passphrase (just rotate-luks-passphrase).
# Old volumes carry the old passphrase in their LUKS header and must be
# discarded; new volumes are formatted fresh with the current passphrase.
#
# Prometheus is intentionally excluded — use ops/migrate-prometheus-encrypted
# when you want to preserve its TSDB data.
#
# Usage:
#   just ops-recreate-encrypted-pvcs          # run for real
#   just ops-recreate-encrypted-pvcs --check  # dry-run (shows what would change)
#
# Safe to re-run: every step waits for full completion before continuing.

- name: Recreate encrypted PVCs for Grafana, Alertmanager, Tempo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    k8s_namespace: monitoring
    prometheus_operator: kube-prometheus-stack-operator

    argocd_apps:
      - name: kube-prometheus-stack
        sync_policy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=false
            - ServerSideApply=true
      - name: tempo
        sync_policy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=false
            - ServerSideApply=true

    workloads:
      - name: Grafana
        kind: Deployment
        resource: kube-prometheus-stack-grafana
        pod_label: app.kubernetes.io/name=grafana
        pvc: kube-prometheus-stack-grafana

      - name: Alertmanager
        kind: StatefulSet
        resource: alertmanager-kube-prometheus-stack-alertmanager
        pod_label: app.kubernetes.io/name=alertmanager
        pvc: alertmanager-kube-prometheus-stack-alertmanager-db-alertmanager-kube-prometheus-stack-alertmanager-0

      - name: Tempo
        kind: StatefulSet
        resource: tempo
        pod_label: app.kubernetes.io/name=tempo
        pvc: storage-tempo-0

  tasks:
    # -- Pre-flight -------------------------------------------------------------

    - name: Pre-flight | Verify hcloud-volumes-encrypted StorageClass exists
      kubernetes.core.k8s_info:
        kind: StorageClass
        name: hcloud-volumes-encrypted
      register: sc_check
      failed_when: sc_check.resources | length == 0

    - name: Pre-flight | Verify hcloud-luks-key Secret exists in kube-system
      kubernetes.core.k8s_info:
        kind: Secret
        name: hcloud-luks-key
        namespace: kube-system
      register: secret_check
      failed_when: secret_check.resources | length == 0

    # -- Pause reconcilers ------------------------------------------------------

    - name: Pause | Stop ArgoCD application controller
      kubernetes.core.k8s_scale:
        kind: StatefulSet
        name: argocd-application-controller
        namespace: argocd
        replicas: 0
        wait: true
        wait_timeout: 120

    - name: Pause | Scale Prometheus Operator to 0
      kubernetes.core.k8s_scale:
        kind: Deployment
        name: "{{ prometheus_operator }}"
        namespace: "{{ k8s_namespace }}"
        replicas: 0
        wait: true
        wait_timeout: 120

    - name: "Pause | Remove ArgoCD auto-sync for {{ item.name }}"
      ansible.builtin.command:
        cmd: >
          kubectl patch application {{ item.name }} -n argocd --type=json -p=[{"op":"remove","path":"/spec/syncPolicy"}]
      changed_when: true
      environment:
        KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') }}"
      loop: "{{ argocd_apps }}"

    # -- Delete workloads -------------------------------------------------------

    - name: "Delete | Remove workload: {{ item.name }}"
      kubernetes.core.k8s:
        kind: "{{ item.kind }}"
        name: "{{ item.resource }}"
        namespace: "{{ k8s_namespace }}"
        state: absent
      loop: "{{ workloads }}"

    - name: "Delete | Wait for pods to terminate: {{ item.name }}"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ k8s_namespace }}"
        label_selectors:
          - "{{ item.pod_label }}"
      register: pod_check
      until: pod_check.resources | length == 0
      retries: 36
      delay: 5
      loop: "{{ workloads }}"

    - name: "Delete | Remove PVC and wait for full deletion: {{ item.name }}"
      kubernetes.core.k8s:
        kind: PersistentVolumeClaim
        name: "{{ item.pvc }}"
        namespace: "{{ k8s_namespace }}"
        state: absent
        wait: true
        wait_timeout: 180
      loop: "{{ workloads }}"

    # -- Restore reconcilers ----------------------------------------------------

    - name: "Restore | Re-enable ArgoCD auto-sync for {{ item.name }}"
      ansible.builtin.command:
        cmd: >
          kubectl patch application {{ item.name }} -n argocd --type=merge -p={"spec":{"syncPolicy":{{ item.sync_policy | to_json }}}}
      changed_when: true
      environment:
        KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') }}"
      loop: "{{ argocd_apps }}"

    - name: Restore | Restart ArgoCD application controller
      kubernetes.core.k8s_scale:
        kind: StatefulSet
        name: argocd-application-controller
        namespace: argocd
        replicas: 1
        wait: true
        wait_timeout: 120

    - name: Restore | Scale Prometheus Operator back to 1
      kubernetes.core.k8s_scale:
        kind: Deployment
        name: "{{ prometheus_operator }}"
        namespace: "{{ k8s_namespace }}"
        replicas: 1
        wait: true
        wait_timeout: 120

    # -- Wait for healthy state -------------------------------------------------

    - name: "Healthy | Wait for pod to be Running: {{ item.name }}"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ k8s_namespace }}"
        label_selectors:
          - "{{ item.pod_label }}"
      register: pod_ready
      until: >
        pod_ready.resources | length > 0 and pod_ready.resources[0].status.phase == "Running"
      retries: 60
      delay: 5
      loop: "{{ workloads }}"

    # -- Post-flight ------------------------------------------------------------

    - name: "Post-flight | Verify PVC uses hcloud-volumes-encrypted: {{ item.name }}"
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        name: "{{ item.pvc }}"
        namespace: "{{ k8s_namespace }}"
      register: pvc_info
      failed_when: >
        pvc_info.resources | length == 0 or pvc_info.resources[0].spec.storageClassName != "hcloud-volumes-encrypted"
      loop: "{{ workloads }}"

    - name: Post-flight | Summary
      ansible.builtin.debug:
        msg: >
          All done. Grafana, Alertmanager, and Tempo are running on fresh hcloud-volumes-encrypted PVCs formatted with the current passphrase.
