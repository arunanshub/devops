# Migrate Prometheus TSDB data from hcloud-volumes to hcloud-volumes-encrypted.
#
# Strategy: rsync TSDB blocks live (immutable once written), then a final
# incremental sync after scaling to 0, then use the PV retain-and-rebind
# technique to give the encrypted PV the name the StatefulSet expects.
#
# Two human checkpoints pause execution for verification.
#
# Usage:
#   just ops-migrate-prometheus
#
# Do NOT use --check: rsync and PV rebind are not idempotent.
# Read through before running. Estimated time: 10-30 min.

- name: Migrate Prometheus TSDB data to encrypted PVC
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    k8s_namespace: monitoring
    prometheus_operator: kube-prometheus-stack-operator
    statefulset: prometheus-kube-prometheus-stack-prometheus
    pod_label: app.kubernetes.io/name=prometheus
    old_pvc: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
    temp_pvc: prometheus-migration-temp
    storage_size: 10Gi
    migration_pod: prometheus-migration
    alpine_image: alpine:3.21
    argocd_app: kube-prometheus-stack
    argocd_sync_policy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true

  tasks:
    # -- Pre-flight -------------------------------------------------------------

    - name: Pre-flight | Verify hcloud-volumes-encrypted StorageClass exists
      kubernetes.core.k8s_info:
        kind: StorageClass
        name: hcloud-volumes-encrypted
      register: sc_check
      failed_when: sc_check.resources | length == 0

    - name: Pre-flight | Verify hcloud-luks-key Secret exists
      kubernetes.core.k8s_info:
        kind: Secret
        name: hcloud-luks-key
        namespace: kube-system
      register: secret_check
      failed_when: secret_check.resources | length == 0

    - name: Pre-flight | Check Prometheus pod state
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ k8s_namespace }}"
        label_selectors:
          - "{{ pod_label }}"
      register: prom_pods

    - name: Pre-flight | Warn if Prometheus already stopped (re-run after partial failure)
      ansible.builtin.debug:
        msg: >
          WARNING: Prometheus pod not Running. Assuming re-run after partial failure.
          Bulk rsync will proceed against the unmounted PVC — this is safe.
      when: >
        prom_pods.resources | length == 0 or
        prom_pods.resources[0].status.phase != "Running"

    - name: Pre-flight | Show Prometheus PVC capacity
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        name: "{{ old_pvc }}"
        namespace: "{{ k8s_namespace }}"
      register: pvc_info

    - name: Pre-flight | Print PVC capacity
      ansible.builtin.debug:
        msg: "Prometheus PVC: {{ pvc_info.resources[0].status.capacity.storage }} ({{ pvc_info.resources[0].spec.storageClassName }})"
    # -- Create temp encrypted PVC ---------------------------------------------

    - name: Setup | Create temporary encrypted PVC
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ temp_pvc }}"
            namespace: "{{ k8s_namespace }}"
          spec:
            storageClassName: hcloud-volumes-encrypted
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: "{{ storage_size }}"

    # -- Bulk rsync (Prometheus still running) ----------------------------------
    # NOTE: hcloud-volumes-encrypted uses WaitForFirstConsumer — the temp PVC
    # will remain Pending until the migration pod is scheduled. Do not wait for
    # Bound here; query the PVC after the pod completes instead.

    - name: Bulk rsync | Launch migration pod
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: "{{ migration_pod }}"
            namespace: "{{ k8s_namespace }}"
          spec:
            restartPolicy: Never
            containers:
              - name: rsync
                image: "{{ alpine_image }}"
                command:
                  - sh
                  - -c
                  - >-
                    set -e; apk add --no-cache rsync; echo '=== bulk rsync ==='; rsync -aH --info=progress2 /old/ /new/; echo '=== done ==='
                volumeMounts:
                  - {name: old, mountPath: /old, readOnly: true}
                  - {name: new, mountPath: /new}
            volumes:
              - {name: old, persistentVolumeClaim: {claimName: "{{ old_pvc }}"}}
              - {name: new, persistentVolumeClaim: {claimName: "{{ temp_pvc }}"}}

    - name: Bulk rsync | Wait for pod to complete
      kubernetes.core.k8s_info:
        kind: Pod
        name: "{{ migration_pod }}"
        namespace: "{{ k8s_namespace }}"
      register: bulk_pod
      until: bulk_pod.resources[0].status.phase in ["Succeeded", "Failed"]
      retries: 120
      delay: 10

    - name: Bulk rsync | Print logs
      kubernetes.core.k8s_log:
        name: "{{ migration_pod }}"
        namespace: "{{ k8s_namespace }}"
      register: bulk_logs

    - name: Bulk rsync | Show logs
      ansible.builtin.debug:
        msg: "{{ bulk_logs.log }}"

    - name: Bulk rsync | Fail if pod did not succeed
      ansible.builtin.fail:
        msg: "Migration pod failed — check logs above."
      when: bulk_pod.resources[0].status.phase != "Succeeded"

    - name: Bulk rsync | Delete migration pod
      kubernetes.core.k8s:
        kind: Pod
        name: "{{ migration_pod }}"
        namespace: "{{ k8s_namespace }}"
        state: absent
        wait: true

    - name: Bulk rsync | Query temp PVC now that it is Bound (pod triggered provisioning)
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        name: "{{ temp_pvc }}"
        namespace: "{{ k8s_namespace }}"
      register: temp_pvc_info
      failed_when: >
        temp_pvc_info.resources | length == 0 or
        temp_pvc_info.resources[0].status.phase != "Bound"

    # -- CHECKPOINT 1 ----------------------------------------------------------

    - name: "CHECKPOINT 1: Verify bulk rsync output"
      ansible.builtin.pause:
        prompt: |
          ================================================
          CHECKPOINT - read before continuing
          ================================================
          Review the rsync logs above:
            - Pod phase was Succeeded (verified)
            - File counts look reasonable for your retention period
            - No rsync error lines

          This is the last safe abort point before Prometheus goes down.
          Press ENTER to continue, Ctrl+C then A to abort.
          ================================================

    # -- Protect PV ------------------------------------------------------------

    - name: Protect | Record temp PV name
      ansible.builtin.set_fact:
        temp_pv_name: "{{ temp_pvc_info.resources[0].spec.volumeName }}"

    - name: Protect | Set temp PV reclaim policy to Retain
      kubernetes.core.k8s:
        kind: PersistentVolume
        name: "{{ temp_pv_name }}"
        merge_type: merge
        definition:
          spec:
            persistentVolumeReclaimPolicy: Retain

    # -- Pause reconcilers -----------------------------------------------------

    - name: Pause | Stop ArgoCD application controller
      kubernetes.core.k8s_scale:
        kind: StatefulSet
        name: argocd-application-controller
        namespace: argocd
        replicas: 0
        wait: true
        wait_timeout: 120

    - name: Pause | Remove ArgoCD auto-sync (app controller stopped so no revert)
      kubernetes.core.k8s:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ argocd_app }}"
        namespace: argocd
        merge_type: merge
        definition:
          spec:
            syncPolicy: null

    - name: Pause | Scale Prometheus Operator to 0
      kubernetes.core.k8s_scale:
        kind: Deployment
        name: "{{ prometheus_operator }}"
        namespace: "{{ k8s_namespace }}"
        replicas: 0
        wait: true
        wait_timeout: 120

    - name: Pause | Scale Prometheus StatefulSet to 0
      kubernetes.core.k8s_scale:
        kind: StatefulSet
        name: "{{ statefulset }}"
        namespace: "{{ k8s_namespace }}"
        replicas: 0
        wait: true
        # Prometheus has terminationGracePeriodSeconds: 600 for TSDB flush.
        # Allow 660s so k8s_scale does not time out before the pod is gone.
        wait_timeout: 660

    - name: Pause | Wait for Prometheus pod to terminate
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ k8s_namespace }}"
        label_selectors: ["{{ pod_label }}"]
      register: prom_gone
      until: prom_gone.resources | length == 0
      # 120 retries × 10s = 20 minutes; comfortably covers the 10-minute grace period.
      retries: 120
      delay: 10

    # -- Final delta rsync -----------------------------------------------------

    - name: Final rsync | Launch delta pod (with --delete)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: "{{ migration_pod }}"
            namespace: "{{ k8s_namespace }}"
          spec:
            restartPolicy: Never
            containers:
              - name: rsync
                image: "{{ alpine_image }}"
                command:
                  - sh
                  - -c
                  - >-
                    set -e; apk add --no-cache rsync; echo '=== final delta ==='; rsync -aH --delete --info=progress2 /old/ /new/; echo '=== done ==='
                volumeMounts:
                  - {name: old, mountPath: /old, readOnly: true}
                  - {name: new, mountPath: /new}
            volumes:
              - {name: old, persistentVolumeClaim: {claimName: "{{ old_pvc }}"}}
              - {name: new, persistentVolumeClaim: {claimName: "{{ temp_pvc }}"}}

    - name: Final rsync | Wait for delta pod to complete
      kubernetes.core.k8s_info:
        kind: Pod
        name: "{{ migration_pod }}"
        namespace: "{{ k8s_namespace }}"
      register: delta_pod
      until: delta_pod.resources[0].status.phase in ["Succeeded", "Failed"]
      retries: 60
      delay: 10

    - name: Final rsync | Print logs
      kubernetes.core.k8s_log:
        name: "{{ migration_pod }}"
        namespace: "{{ k8s_namespace }}"
      register: delta_logs

    - name: Final rsync | Show logs
      ansible.builtin.debug:
        msg: "{{ delta_logs.log }}"

    - name: Final rsync | Fail if pod did not succeed
      ansible.builtin.fail:
        msg: "Final rsync failed. Old PVC is intact — safe to retry."
      when: delta_pod.resources[0].status.phase != "Succeeded"

    - name: Final rsync | Delete migration pod
      kubernetes.core.k8s:
        kind: Pod
        name: "{{ migration_pod }}"
        namespace: "{{ k8s_namespace }}"
        state: absent
        wait: true

    # -- PV retain-and-rebind --------------------------------------------------

    - name: Rebind | Delete temp PVC (PV survives due to Retain)
      kubernetes.core.k8s:
        kind: PersistentVolumeClaim
        name: "{{ temp_pvc }}"
        namespace: "{{ k8s_namespace }}"
        state: absent
        wait: true
        wait_timeout: 120

    - name: Rebind | Clear PV claimRef to make it Available
      kubernetes.core.k8s:
        kind: PersistentVolume
        name: "{{ temp_pv_name }}"
        merge_type: json
        definition:
          - op: remove
            path: /spec/claimRef

    - name: Rebind | Wait for PV to be Available
      kubernetes.core.k8s_info:
        kind: PersistentVolume
        name: "{{ temp_pv_name }}"
      register: pv_avail
      until: pv_avail.resources[0].status.phase == "Available"
      retries: 24
      delay: 5

    - name: Rebind | Delete old unencrypted PVC
      kubernetes.core.k8s:
        kind: PersistentVolumeClaim
        name: "{{ old_pvc }}"
        namespace: "{{ k8s_namespace }}"
        state: absent
        wait: true
        wait_timeout: 120

    - name: Rebind | Create new encrypted PVC pre-bound to migrated PV
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ old_pvc }}"
            namespace: "{{ k8s_namespace }}"
          spec:
            storageClassName: hcloud-volumes-encrypted
            volumeName: "{{ temp_pv_name }}"
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: "{{ storage_size }}"

    - name: Rebind | Wait for new PVC to be Bound
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        name: "{{ old_pvc }}"
        namespace: "{{ k8s_namespace }}"
      register: new_pvc
      until: new_pvc.resources[0].status.phase == "Bound"
      retries: 24
      delay: 5

    # -- Cutover ---------------------------------------------------------------

    - name: Cutover | Delete Prometheus StatefulSet
      kubernetes.core.k8s:
        kind: StatefulSet
        name: "{{ statefulset }}"
        namespace: "{{ k8s_namespace }}"
        state: absent
        wait: true

    - name: Cutover | Restore Prometheus Operator
      kubernetes.core.k8s_scale:
        kind: Deployment
        name: "{{ prometheus_operator }}"
        namespace: "{{ k8s_namespace }}"
        replicas: 1
        wait: true
        wait_timeout: 120

    - name: Cutover | Re-enable ArgoCD auto-sync
      kubernetes.core.k8s:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ argocd_app }}"
        namespace: argocd
        merge_type: merge
        definition:
          spec:
            syncPolicy: "{{ argocd_sync_policy }}"

    - name: Cutover | Restore ArgoCD application controller
      kubernetes.core.k8s_scale:
        kind: StatefulSet
        name: argocd-application-controller
        namespace: argocd
        replicas: 1
        wait: true
        wait_timeout: 120

    - name: Cutover | Wait for Prometheus pod to be Running
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ k8s_namespace }}"
        label_selectors: ["{{ pod_label }}"]
      register: prom_up
      until: >
        prom_up.resources | length > 0 and prom_up.resources[0].status.phase == "Running"
      retries: 60
      delay: 10

    # -- CHECKPOINT 2 ----------------------------------------------------------

    - name: "CHECKPOINT 2: Verify Prometheus has historical data"
      ansible.builtin.pause:
        prompt: |
          ================================================
          CHECKPOINT - verify before cleanup
          ================================================
          Prometheus is running on the new encrypted PVC.

          Please verify:
            - Open Grafana and check historical graphs show data
            - Query something in Prometheus UI that should have history

          If data is missing: the old PV still has Retain policy.
          Abort and investigate before cleanup.

          Press ENTER to proceed, Ctrl+C then A to abort.
          ================================================

    # -- Cleanup ---------------------------------------------------------------

    - name: Cleanup | Restore PV reclaim policy to Delete
      kubernetes.core.k8s:
        kind: PersistentVolume
        name: "{{ temp_pv_name }}"
        merge_type: merge
        definition:
          spec:
            persistentVolumeReclaimPolicy: Delete

    - name: Cleanup | Verify final PVC uses hcloud-volumes-encrypted
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        name: "{{ old_pvc }}"
        namespace: "{{ k8s_namespace }}"
      register: final_pvc
      failed_when: >
        final_pvc.resources | length == 0 or final_pvc.resources[0].spec.storageClassName != "hcloud-volumes-encrypted"

    - name: Cleanup | Summary
      ansible.builtin.debug:
        msg: "Migration complete. Prometheus is on {{ temp_pv_name }} (hcloud-volumes-encrypted). Historical data intact."
