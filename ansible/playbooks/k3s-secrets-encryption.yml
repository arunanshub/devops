# One-shot, OPERATOR-SUPERVISED playbook — do NOT import into site.yml.
# Phase 4 (see docs/2026-06-19-unused-optimization-levers.md): enable k3s Secrets Encryption at rest.
#
# WHY. etcd snapshots ship to Cloudflare R2 (infra/cloudflare_storage.tf, bucket etcd_snapshots) in
# PLAINTEXT today — so every Secret in etcd is readable offline from a snapshot: the Sealed-Secrets
# master key, the hcloud API token, the Cloudflare tunnel token, SMTP/Grafana creds. Enabling
# `--secrets-encryption` AES-encrypts Secrets at rest in etcd, and therefore in every FUTURE snapshot,
# closing that offline-read exposure. This is the last outstanding item from the 2026-06-19 sweep.
#
# ┌── READ BEFORE RUNNING ─────────────────────────────────────────────────────────────────────────┐
# │ k3s warns: "Failure to follow proper procedure for rotating encryption keys can leave your      │
# │ cluster permanently corrupted." This is the highest-care node-config change in this repo.       │
# │                                                                                                  │
# │ 1. TAKE A FRESH etcd SNAPSHOT FIRST — it is the rollback anchor. (It is also the LAST plaintext  │
# │    snapshot; treat/expire it deliberately.) On any control plane:                               │
# │       k3s etcd-snapshot save --name pre-secrets-encryption                                       │
# │    Then re-run this playbook passing -e snapshot_confirmed=true to acknowledge you did.          │
# │ 2. Dry-run first:   just ansible-check    k3s-secrets-encryption                                 │
# │ 3. Apply:           just ansible-converge k3s-secrets-encryption -e snapshot_confirmed=true      │
# └──────────────────────────────────────────────────────────────────────────────────────────────────┘
#
# DOC-BACKED SEQUENCE (https://docs.k3s.io/cli/secrets-encrypt — "Enable Secrets Encryption on an
# Existing Cluster", HA variant). Version-gated: the modern enable-on-existing-cluster flow is
# available as of the March 2026 releases (v1.33.10+/v1.34.6+/v1.35.3+k3s1). This cluster runs
# v1.36.2+k3s1 → supported. The exact ordered flow, encoded as the five plays below:
#   1. status == "Disabled, no configuration file found"   (precondition)
#   2. `k3s secrets-encrypt enable`                          (ONE server)
#   3. add `secrets-encryption: true`, restart S1→S2→S3      (rolling, one at a time)
#   4. status == stage "start" + "All hashes match"          (gate before rotate)
#   5. `k3s secrets-encrypt rotate-keys`                     (ONE server; reencrypts existing secrets)
#   6. restart S1→S2→S3 again                                (rolling)
#   7. status == "Enabled" + stage "reencrypt_finished" + "All hashes match"   (verify)
#
# SAFETY. Every rolling play is serial:1 + max_fail_percentage:0 + order:sorted, so a bad restart on
# any node halts the play with etcd quorum (2/3) intact; and the Ready-wait uses default([]) because
# the operator kubeconfig points at cp-1, which is briefly unreachable while it restarts. A k3s
# restart is NON-disruptive to running pods (it re-attaches to existing containers via containerd).
# The destructive CLI stages (`enable`, `rotate-keys`) are STATUS-GATED, so an interrupted run resumes
# from where it stopped rather than double-applying. If a run halts mid-way, inspect state by hand
# (`k3s secrets-encrypt status` on each CP) before re-running.
#
# REVERSIBILITY (stateful — snapshot is the anchor): `k3s secrets-encrypt disable` on one server →
# restart all → `k3s secrets-encrypt reencrypt --force --skip`, then remove this drop-in.

# ── Play 1 — precondition + enable (one server) ────────────────────────────────────────────────────
- name: "Secrets encryption — precondition + enable"
  hosts: control_planes
  gather_facts: false
  become: true
  run_once: true # the `enable` subcommand is issued on exactly ONE server (k3s coordinates the rest)
  vars:
    k3s_bin: /usr/local/bin/k3s
  tasks:
    - name: Require an explicit pre-change etcd snapshot acknowledgement
      ansible.builtin.assert:
        that:
          - snapshot_confirmed | default(false) | bool
        fail_msg: >-
          Refusing to proceed. Take a fresh etcd snapshot first
          (`k3s etcd-snapshot save --name pre-secrets-encryption`), then re-run with
          -e snapshot_confirmed=true. The snapshot is the only rollback anchor for this change.
        success_msg: "Pre-change etcd snapshot acknowledged by operator."

    - name: Read current secrets-encryption status
      ansible.builtin.command:
        cmd: "{{ k3s_bin }} secrets-encrypt status"
      register: se_status_pre
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: "Enable secrets encryption (only if currently Disabled with no config)"
      # Gated on the exact pristine state so a resumed run never re-issues enable over an
      # already-configured cluster. After this, encryption is not yet active — restart + rotate follow.
      ansible.builtin.command:
        cmd: "{{ k3s_bin }} secrets-encrypt enable"
      register: se_enable
      changed_when: se_enable.rc == 0
      when:
        - not ansible_check_mode
        - "'no configuration file found' in (se_status_pre.stdout | default(''))"

    - name: Report enable-stage decision
      ansible.builtin.debug:
        msg: >-
          {{ 'enable issued on ' ~ inventory_hostname
             if (se_enable is defined and se_enable is not skipped)
             else 'enable skipped — cluster is past the pristine state (resuming later stage)' }}
      when: not ansible_check_mode

# ── Play 2 — add flag to every server + rolling restart (S1→S2→S3) ─────────────────────────────────
- name: "Secrets encryption — deploy flag + rolling restart"
  hosts: control_planes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  order: sorted
  handlers:
    - name: Restart k3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted
  tasks:
    - name: Create k3s config drop-in directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy secrets-encryption drop-in
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/secrets-encryption.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          # AES-CBC encryption of Secret objects at rest in embedded etcd (and thus in every future
          # R2 snapshot). Kept as a persistent config flag — not just the one-time `secrets-encrypt
          # enable` — so the setting survives the frequent k3s restarts on this cluster (kured
          # reboots, SUC upgrades, other ansible one-shots). Key material lives in
          # /var/lib/rancher/k3s/server/cred/encryption-config.json (node-local, never in git).
          secrets-encryption: true
      notify: Restart k3s

    - name: Flush handlers (restart k3s before verifying)
      ansible.builtin.meta: flush_handlers

    - name: Wait for this node to be Ready again
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ kubernetes_node_name }}"
      register: node_info
      delegate_to: localhost
      become: false
      until: >
        (node_info.resources | default([]) | length > 0) and (node_info.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready')
         | map(attribute='status') | list | first | default('')) == 'True'
      retries: 30
      delay: 10
      when: not ansible_check_mode

# ── Play 3 — gate on "start" stage + rotate keys (one server) ──────────────────────────────────────
- name: "Secrets encryption — verify start stage + rotate keys"
  hosts: control_planes
  gather_facts: false
  become: true
  run_once: true
  vars:
    k3s_bin: /usr/local/bin/k3s
  tasks:
    - name: Read status after the flag rollout
      ansible.builtin.command:
        cmd: "{{ k3s_bin }} secrets-encrypt status"
      register: se_status_start
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: "Gate: all server hashes must match before rotating keys"
      # Rotating with mismatched hashes across nodes is the documented path to corruption. Halt here
      # unless every server agrees. (Skip the gate only once already Enabled — i.e. a completed re-run.)
      ansible.builtin.assert:
        that:
          - "'All hashes match' in (se_status_start.stdout | default(''))"
        fail_msg: >-
          Server encryption hashes do not match across control planes — NOT rotating keys.
          Ensure Play 2 restarted every server (status should show stage 'start', all hashes match)
          before continuing. Inspect with `k3s secrets-encrypt status` on each CP.
      when:
        - not ansible_check_mode
        - "'Encryption Status: Enabled' not in (se_status_start.stdout | default(''))"

    - name: "Rotate keys to activate encryption + reencrypt existing secrets (only at stage 'start')"
      # rotate-keys is the modern (v1.30+) command that activates the new key AND reencrypts existing
      # secrets (~5/sec). Gated on stage 'start' so a resumed/completed run does not re-rotate.
      ansible.builtin.command:
        cmd: "{{ k3s_bin }} secrets-encrypt rotate-keys"
      register: se_rotate
      changed_when: se_rotate.rc == 0
      when:
        - not ansible_check_mode
        - "'Current Rotation Stage: start' in (se_status_start.stdout | default(''))"

# ── Play 4 — second rolling restart (S1→S2→S3) so every node reaches reencrypt_finished ────────────
- name: "Secrets encryption — post-rotate rolling restart"
  hosts: control_planes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  order: sorted
  vars:
    k3s_bin: /usr/local/bin/k3s
  tasks:
    - name: Read this node's status
      ansible.builtin.command:
        cmd: "{{ k3s_bin }} secrets-encrypt status"
      register: se_status_node
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: "Restart k3s to pick up rotated keys (only if this node isn't already finished)"
      # Gated per-node on reencrypt_finished, so a completed re-run restarts nothing.
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when:
        - not ansible_check_mode
        - "'reencrypt_finished' not in (se_status_node.stdout | default(''))"

    - name: Wait for this node to be Ready again
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ kubernetes_node_name }}"
      register: node_info
      delegate_to: localhost
      become: false
      until: >
        (node_info.resources | default([]) | length > 0) and (node_info.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready')
         | map(attribute='status') | list | first | default('')) == 'True'
      retries: 30
      delay: 10
      when: not ansible_check_mode

# ── Play 5 — final verification ────────────────────────────────────────────────────────────────────
- name: "Secrets encryption — verify Enabled"
  hosts: control_planes
  gather_facts: false
  become: true
  run_once: true
  vars:
    k3s_bin: /usr/local/bin/k3s
  tasks:
    - name: Read final status
      ansible.builtin.command:
        cmd: "{{ k3s_bin }} secrets-encrypt status"
      register: se_status_final
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: "Assert encryption is Enabled and reencryption finished with matching hashes"
      ansible.builtin.assert:
        that:
          - "'Encryption Status: Enabled' in (se_status_final.stdout | default(''))"
          - "'reencrypt_finished' in (se_status_final.stdout | default(''))"
          - "'All hashes match' in (se_status_final.stdout | default(''))"
        fail_msg: "Secrets encryption did NOT reach Enabled/reencrypt_finished. Status:\n{{ se_status_final.stdout | default('(no output)') }}"
        success_msg: "Secrets encryption Enabled on all control planes (reencrypt_finished, hashes match)."
      when: not ansible_check_mode

    - name: "Next steps"
      ansible.builtin.debug:
        msg: >-
          Encryption at rest is live. Take a NEW etcd snapshot so R2 holds an encrypted one
          (`k3s etcd-snapshot save --name post-secrets-encryption`), and expire the pre-change
          plaintext snapshot. Confirm `just verify-mtu` and cluster health are clean.
      when: not ansible_check_mode
