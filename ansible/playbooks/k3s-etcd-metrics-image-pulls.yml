# One-shot playbook — do NOT import into site.yml.
# Phase 2 node-config (gitops-sibling: see docs/2026-06-19-unused-optimization-levers.md):
#   (1) expose embedded-etcd metrics on :2381 so vmagent can scrape etcd health;
#   (2) enable parallel image pulls (faster node recovery / rollouts).
#
# Restarts k3s on each control-plane node ONE AT A TIME (serial:1) → etcd quorum (2/3) preserved
# throughout. A k3s restart is NON-disruptive to running pods: it re-attaches to existing
# containers via containerd, it does not recreate them. The API stays reachable through the
# private LB during each single-node restart.
#
# ORDER: run this and confirm :2381 is exposed on every node BEFORE shipping the gitops follow-up
# (kubeEtcd scrape with endpoints 10.0.0.2/3/4:2381 + re-enabled etcd default rules). Enabling the
# scrape first would point a VMServiceScrape at a closed port → spurious down-target alert.
#
# Run:  just ansible-check    k3s-etcd-metrics-image-pulls   # dry-run (--check --diff), no changes
#       just ansible-converge k3s-etcd-metrics-image-pulls   # apply (rolling, one node at a time)
- name: Configure k3s etcd metrics exposure + parallel image pulls (Phase 2)
  hosts: control_planes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  order: sorted
  handlers:
    # Both drop-in copy tasks notify this handler; handlers de-dupe by name, so even when both
    # files change k3s is restarted exactly once (preserving the original single-restart behaviour).
    # flush_handlers (below) forces this to run BEFORE the wait/verify tasks under serial:1, and
    # under serial each batch is a full play, so handlers flush per-host. A failed restart here
    # fails the host → with serial:1 that is 100% > max_fail_percentage:0 → the play aborts before
    # the next node, so etcd quorum (2/3) is preserved.
    - name: Restart k3s
      ansible.builtin.systemd:
        name: "{{ k3s_service_name }}"
        state: restarted

  tasks:
    - name: Set k3s service name
      ansible.builtin.set_fact:
        k3s_service_name: k3s

    - name: Create k3s config drop-in directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy etcd-expose-metrics drop-in
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/etcd-expose-metrics.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          # Bind embedded-etcd metrics to a non-loopback :2381 (k3s default is 127.0.0.1 only) so
          # the in-cluster vmagent can reach them. :2381 is unauthenticated plain HTTP — acceptable
          # because it is reachable only on the Hetzner private network (10.0.0.x); the Hetzner
          # Cloud Firewall filters public NICs only and does not expose it to the internet.
          etcd-expose-metrics: true
      notify: Restart k3s

    - name: Deploy parallel-image-pulls kubelet drop-in
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/image-pull-parallelism.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          # kubelet-arg+ APPENDS to k3s's kubelet args (the trailing + means merge, not replace),
          # so this composes with the eviction drop-in's kubelet-arg+ instead of clobbering it.
          # max-parallel-image-pulls > 1 REQUIRES serialize-image-pulls=false (kubelet validation).
          kubelet-arg+:
            - "serialize-image-pulls=false"
            - "max-parallel-image-pulls=3"
      notify: Restart k3s

    # Force the Restart k3s handler to run now (before wait/verify) instead of at play end.
    # Under serial:1 this flushes for the current single-host batch.
    - name: Flush handlers (restart k3s before verifying)
      ansible.builtin.meta: flush_handlers

    - name: Wait for this node to be Ready again
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ kubernetes_node_name }}"
      register: node_info
      delegate_to: localhost
      become: false
      until: >
        node_info.resources | length > 0 and (node_info.resources[0].status.conditions |
         selectattr('type', 'equalto', 'Ready') |
         map(attribute='status') | list | first) == 'True'
      retries: 30
      delay: 10
      when: not ansible_check_mode

    - name: Verify etcd metrics now listen beyond loopback (etcd-expose-metrics took effect)
      # k3s binds :2381 to 127.0.0.1 by default and to a non-loopback address once exposed, so
      # "a :2381 listener on a non-loopback address exists" is the precise signal the flag landed.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -ltn | awk '$4 ~ /:2381$/' | grep -vqE '(127\.0\.0\.1|\[::1\]):2381'
        executable: /bin/bash
      register: etcd_listen_check
      changed_when: false
      until: etcd_listen_check.rc == 0
      retries: 12
      delay: 5
      when: not ansible_check_mode

    - name: Verify parallel image pulls in live kubelet config (configz)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl get --raw /api/v1/nodes/{{ kubernetes_node_name }}/proxy/configz \
          | python3 -c 'import json,sys; k=json.load(sys.stdin)["kubeletconfig"];
          assert k.get("serializeImagePulls") is False, "serializeImagePulls="+repr(k.get("serializeImagePulls"));
          assert k.get("maxParallelImagePulls")==3, "maxParallelImagePulls="+repr(k.get("maxParallelImagePulls"))'
        executable: /bin/bash
      delegate_to: localhost
      become: false
      register: pull_verify
      changed_when: false
      until: pull_verify.rc == 0
      retries: 12
      delay: 5
      when: not ansible_check_mode

    - name: Summary (per node)
      ansible.builtin.debug:
        msg: >-
          {{ kubernetes_node_name }}: etcd metrics exposed on :2381, parallel image pulls active. After ALL nodes complete, ship gitops step 2b (kubeEtcd scrape) — see the levers doc.
      when: not ansible_check_mode
