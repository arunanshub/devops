name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # The linter is a custom golangci-lint build with the nilaway plugin
      # (see .custom-gcl.yaml) — same binary lefthook uses locally.
      - name: Cache custom golangci-lint
        id: cache-gcl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ hashFiles('.custom-gcl.yaml') }}

      - name: Build custom golangci-lint
        if: steps.cache-gcl.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint custom

      - name: Check formatting
        run: ./custom-gcl fmt --diff

      - name: Lint
        run: ./custom-gcl run ./...

      # Guards the helmfile→ArgoCD adoption invariant (chart version,
      # releaseName, rendered values). See CLAUDE.md "Helmfile→ArgoCD adoption".
      - name: Verify helmfile→ArgoCD adoption invariant
        env:
          # Must match the K8S_API_ENDPOINT exported by the Justfile.
          K8S_API_ENDPOINT: "10.0.0.100"
          # Rendered but excluded from comparison (bootstrap-only overlay).
          ARGOCD_ADMIN_PASSWORD_HASH: "ci-placeholder"
        run: go run ./cmd/opsctl verify-adoption

  kubernetes:
    name: Kustomize render + kubeconform
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: 5.8.1
      KUBECONFORM_VERSION: 0.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kustomize and kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -C /usr/local/bin -xz kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -C /usr/local/bin -xz kubeconform

      # Mirrors the lefthook kustomize-validate hook exactly.
      - name: Validate rendered manifests
        run: >
          kustomize build kubernetes/overlays/prod | kubeconform --strict --ignore-missing-schemas --summary --schema-location default --schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  tofu:
    name: OpenTofu fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.4

      - name: Check formatting
        run: tofu -chdir=infra fmt -check -recursive

      - name: Init (no backend, no state)
        run: tofu -chdir=infra init -backend=false

      - name: Validate
        run: tofu -chdir=infra validate

  hygiene:
    name: yamlfmt, shellcheck, just fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: yamlfmt lint
        run: |
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
          yamlfmt -lint

      # shellcheck is preinstalled on ubuntu runners.
      - name: shellcheck
        run: >
          git ls-files '*.sh' '*.bash' '*.sh.tpl' '*.bash.tpl' | xargs -r shellcheck --enable=all --severity=style

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.56.0"
      - name: Check Justfile formatting
        run: just --fmt --check --unstable

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — gitleaks scans every commit, not just the tree.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
